<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aperçu atlas Maison</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f5f6ef;color:#17212b;padding:24px max(16px,env(safe-area-inset-left)) 40px}
main{max-width:1200px;margin:auto}
h1{margin:0 0 6px;font-size:30px;color:#0f5f43}
p{margin:0 0 18px;color:#6e7781;line-height:1.45}
.grid{display:grid;gap:22px}
.option{background:#fff;border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(25,45,35,.08)}
.option h2{margin:0 0 4px;font-size:21px}
.option small{display:block;color:#7d858d;margin-bottom:12px}
canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #eef0eb;border-radius:14px}
.zoom{margin-top:12px}
.zoom strong{display:block;margin-bottom:7px;font-size:13px;color:#5f6a72}
.status{padding:18px;background:#fff;border-radius:18px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
<h1>Atlas Maison — aperçu espacement</h1>
<p>Source : atlas Maison actuel du dépôt. Aucun produit n’est régénéré. Chaque case reste à sa place ; seul le contenu de la case est réduit et recentré pour créer une marge identique autour.</p>
<div id="status" class="status">Chargement de l’atlas actuel…</div>
<div id="grid" class="grid" hidden></div>
</main>
<script>
const SRC='./bring-photo-v4-maison.webp.png?v=14';
const COLS=12, ROWS=7;
const OPTIONS=[
  {gap:.04,label:'4 %',note:'Très léger — produits les plus grands'},
  {gap:.06,label:'6 %',note:'Équilibre taille / sécurité'},
  {gap:.08,label:'8 %',note:'Plus sûr — produits un peu plus petits'}
];
const img=new Image();
img.onload=()=>{
  const cw=img.naturalWidth/COLS, ch=img.naturalHeight/ROWS;
  const grid=document.getElementById('grid');
  for(const opt of OPTIONS){
    const card=document.createElement('section'); card.className='option';
    const h=document.createElement('h2'); h.textContent='Marge '+opt.label;
    const sm=document.createElement('small'); sm.textContent=opt.note;
    const full=document.createElement('canvas');
    const zoomWrap=document.createElement('div'); zoomWrap.className='zoom';
    const zt=document.createElement('strong'); zt.textContent='Zoom Lessive + Vaisselle';
    const zoom=document.createElement('canvas');
    card.append(h,sm,full,zoomWrap); zoomWrap.append(zt,zoom); grid.append(card);

    const scale=.55;
    full.width=Math.round(img.naturalWidth*scale); full.height=Math.round(img.naturalHeight*scale);
    const fctx=full.getContext('2d'); fctx.imageSmoothingEnabled=true; fctx.imageSmoothingQuality='high';
    const tcw=full.width/COLS, tch=full.height/ROWS;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const dx=c*tcw+tcw*opt.gap, dy=r*tch+tch*opt.gap;
      const dw=tcw*(1-opt.gap*2), dh=tch*(1-opt.gap*2);
      fctx.drawImage(img,c*cw,r*ch,cw,ch,dx,dy,dw,dh);
    }

    const zr0=1, zrows=2;
    zoom.width=Math.round(img.naturalWidth*.78); zoom.height=Math.round(ch*zrows*.78);
    const zctx=zoom.getContext('2d'); zctx.imageSmoothingEnabled=true; zctx.imageSmoothingQuality='high';
    const zcw=zoom.width/COLS, zch=zoom.height/zrows;
    for(let rr=0;rr<zrows;rr++) for(let c=0;c<COLS;c++){
      const r=zr0+rr;
      const dx=c*zcw+zcw*opt.gap, dy=rr*zch+zch*opt.gap;
      const dw=zcw*(1-opt.gap*2), dh=zch*(1-opt.gap*2);
      zctx.drawImage(img,c*cw,r*ch,cw,ch,dx,dy,dw,dh);
    }
  }
  document.getElementById('status').hidden=true;
  grid.hidden=false;
};
img.onerror=()=>{document.getElementById('status').textContent="Impossible de charger l’atlas source.";};
img.src=SRC;
</script>
</body>
</html>
