<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#241a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Courses">
  <link rel="icon" href="./apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>Installer Courses</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(155deg,#4b3342,#1f171e);color:#fff;padding:32px}
    main{width:min(100%,420px);text-align:center}
    img{width:132px;height:132px;border-radius:28px;display:block;margin:0 auto 24px;object-fit:cover}
    h1{font-size:28px;margin:0 0 10px}
    p{font-size:17px;line-height:1.45;color:rgba(255,255,255,.76);margin:0 0 18px}
    .ok{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.10);font-weight:650}
    a{color:#fff}
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" alt="Icône Courses">
    <h1>Courses</h1>
    <p id="status">Préparation de l’installation…</p>
    <p class="ok" id="help" hidden>Icône chargée. Ouvre le menu Partager de Safari, puis <strong>Sur l’écran d’accueil</strong> et garde <strong>Ouvrir comme app web</strong> activé.</p>
  </main>
  <script>
    (async()=>{
      const standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
      if(standalone){
        location.replace('./');
        return;
      }
      const cleaned=sessionStorage.getItem('courses-ios-install-cleaned')==='1';
      if(!cleaned){
        try{
          if('serviceWorker' in navigator){
            const regs=await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(reg=>reg.unregister()));
          }
          if('caches' in window){
            const keys=await caches.keys();
            await Promise.all(keys.map(key=>caches.delete(key)));
          }
        }catch(_){}
        sessionStorage.setItem('courses-ios-install-cleaned','1');
        location.replace('./install-ios.html?ready=1');
        return;
      }
      document.getElementById('status').textContent='Installation prête';
      document.getElementById('help').hidden=false;
    })();
  </script>
</body>
</html>
