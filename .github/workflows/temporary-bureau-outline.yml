name: Diagnostic temporaire — nouvelle pièce Bureau
on:
  push:
    branches: [fix-bureau-wall-crop-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Examiner le nouveau fond 14-piece-vide 2
        shell: bash
        run: |
          mkdir -p /tmp/bureau-diagnostic
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          src=Path('www/Bureau/14-piece-vide 2.png')
          im=Image.open(src).convert('RGBA')
          print('14 SOURCE',im.size,'mode',im.mode,'corners',[im.getpixel(pt) for pt in [(0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)]])
          orig=im.copy()
          orig.thumbnail((1200,900))
          orig.save('/tmp/bureau-diagnostic/new-piece-original.png')
          points=[(62,378),(707,0),(728,0),(728,26),(1404,416),(1404,698),(755,1074),(709,1074),(62,698)]
          overlay=im.copy()
          d=ImageDraw.Draw(overlay)
          d.line(points+[points[0]],fill=(250,0,30),width=6)
          overlay.thumbnail((1200,900))
          overlay.save('/tmp/bureau-diagnostic/new-piece-with-old-mask.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bureau-nouvelle-source
          path: /tmp/bureau-diagnostic/
          if-no-files-found: error
