name: build-catalog-persistent-v444

on:
  push:
    branches:
      - automation/catalog-persistent-v444-build
    paths:
      - .github/workflows/build-catalog-persistent-v444.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build v444 candidate
        run: python3 scripts/build_v444_candidate.py
      - name: Run Node tests
        run: node --test tests/*.test.mjs
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "Fabien"
          git config user.email "canape-silence-8o@icloud.com"
          git add app.js dishes-ui.js product-item-images.js catalog-quantities.js product-item-first-paint.css tests/catalog-quantities-events.test.mjs tests/catalog-first-paint-shell.test.mjs tests/app-responsibility-extraction.test.mjs tests/catalog-persistent-grid.test.mjs index.html catalog.js runtime-features.js dish-local-images.js sw.js
          git commit -m "v444 candidate build"
          git push origin HEAD:automation/catalog-persistent-v444-build
