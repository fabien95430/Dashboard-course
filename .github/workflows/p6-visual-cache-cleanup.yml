name: P6 nettoyage cache visuel

on:
  push:
    branches: [p6-visual-cache-cleanup]

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6-visual-cache-cleanup
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Appliquer P6
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, value): Path(path).write_text(value, encoding='utf-8')
          def replace_required(source, old, new, label, count=None):
              found=source.count(old)
              if found<1: raise SystemExit(f'{label} introuvable')
              if count is not None and found!=count: raise SystemExit(f'{label}: {found} occurrences au lieu de {count}')
              return source.replace(old,new)

          sw=read('sw.js')
          sw=replace_required(sw,"const CACHE='courses-app-v413-r1';","const CACHE='courses-app-v414-r1';",'cache applicatif',1)
          for old,new,label in [
              ('./catalog.js?v=413','./catalog.js?v=414','catalogue SW'),
              ('./bottom-nav-liquid.js?v=413','./bottom-nav-liquid.js?v=414','navigation SW'),
              ('./app.js?v=413','./app.js?v=414','app SW'),
              ('./dish-local-images.js?v=413','./dish-local-images.js?v=414','images SW'),
          ]:
              sw=replace_required(sw,old,new,label,1)
          start=sw.find('\nasync function migrateExistingVisuals(){')
          end=sw.find('\nasync function seedCoreVisuals(){',start)
          if start<0 or end<0: raise SystemExit('migration visuelle introuvable')
          sw=sw[:start]+'\n'+sw[end:]
          sw=replace_required(sw,'    migrateExistingVisuals().then(seedCoreVisuals)','    seedCoreVisuals()','chaîne install visuelle',1)
          write('sw.js',sw)

          index=read('index.html')
          index=replace_required(index,'<span class="page-version">v413</span>','<span class="page-version">v414</span>','badges version',3)
          for old,new,label in [
              ('<script src="./catalog.js?v=413"></script>','<script src="./catalog.js?v=414"></script>','catalogue index'),
              ('<script src="./bottom-nav-liquid.js?v=413"></script>','<script src="./bottom-nav-liquid.js?v=414"></script>','navigation index'),
              ('<script src="./app.js?v=413"></script>','<script src="./app.js?v=414"></script>','app index'),
          ]:
              index=replace_required(index,old,new,label,1)
          write('index.html',index)

          catalog=read('catalog.js')
          catalog=replace_required(catalog,"./dish-local-images.js?v=413","./dish-local-images.js?v=414",'révision images catalogue',1)
          write('catalog.js',catalog)

          images=read('dish-local-images.js')
          images=replace_required(images,"const APP_VERSION='v413';","const APP_VERSION='v414';",'version images',1)
          write('dish-local-images.js',images)

          version_test=read('tests/list-render-version.test.mjs')
          version_test=replace_required(version_test,'P4 publie la version globale v413','P6 publie la version globale v414','titre test version',1)
          version_test=replace_required(version_test,'v413','v414','attentes test version')
          if 'v413' in version_test: raise SystemExit('v413 subsiste dans list-render-version')
          write('tests/list-render-version.test.mjs',version_test)

          nav_test=read('tests/app-responsibility-extraction.test.mjs')
          nav_test=replace_required(nav_test,'v413','v414','attentes test navigation')
          if 'v413' in nav_test: raise SystemExit('v413 subsiste dans app-responsibility-extraction')
          write('tests/app-responsibility-extraction.test.mjs',nav_test)

          test_content=dedent(r"""
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const sw=fs.readFileSync(new URL('../sw.js',import.meta.url),'utf8');

          test('P6 conserve un cache visuel persistant sans remigration des anciens caches',()=>{
            assert.match(sw,/const VISUAL_CACHE='courses-visuals-v2';/);
            assert.doesNotMatch(sw,/function migrateExistingVisuals|migrateExistingVisuals\(/);
            assert.match(sw,/caches\.keys\(\)[\s\S]*?key!==CACHE&&key!==VISUAL_CACHE&&key!==ERROR_INBOX_CACHE/);
            assert.match(sw,/caches\.open\(VISUAL_CACHE\)/);
          });

          test('les visuels critiques sont toujours seedés et les items/plats restent persistants',()=>{
            for(const asset of ['welcome-cart-transparent-v46.png','welcome-background-v40.webp','www/empty-list-premium-v4.webp'])assert.ok(sw.includes(asset),asset+' absent des visuels critiques');
            assert.match(sw,/url\.pathname\.includes\('\/www\/Plats\/'\)/);
            assert.match(sw,/url\.pathname\.includes\('\/www\/Items\/'\)/);
            assert.match(sw,/caches\.open\(CACHE\)\.then\(cache=>cache\.addAll\(SHELL\)\),\s*seedCoreVisuals\(\)/s);
          });
          """).lstrip()
          write('tests/visual-cache-cleanup.test.mjs',test_content)

          Path('.github/workflows/p6-visual-cache-cleanup.yml').unlink()
      - name: Valider le dépôt
        run: bash scripts/validate_repo.sh
      - name: Commit de l'arbre validé
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v414: simplifie le cache visuel persistant"
          git push origin HEAD:p6-visual-cache-cleanup
