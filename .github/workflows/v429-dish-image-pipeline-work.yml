name: v429 dish image pipeline work

on:
  push:
    branches: [automation/v429-dish-image-pipeline-work]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply audited patch
        run: |
          python .github/v429_apply.py
          python .github/v429_fix_tests.py
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        shell: bash
        run: |
          rm .github/v429_apply.py .github/v429_fix_tests.py .github/workflows/v429-dish-image-pipeline-work.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v429: précharge les plats après les visuels produits"
          git push origin HEAD:automation/v429-dish-image-pipeline-work
