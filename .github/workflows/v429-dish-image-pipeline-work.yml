name: v429 dish image pipeline work

on:
  push:
    branches: [automation/v429-dish-image-pipeline-work]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply v429 image pipeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path,text):
              Path(path).write_text(text,encoding='utf-8')
          def once(path,old,new):
              text=read(path)
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              write(path,text.replace(old,new,1))
          def replace_all(path,old,new,expected=None):
              text=read(path)
              count=text.count(old)
              if expected is not None and count!=expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              if not count:
                  raise SystemExit(f'{path}: missing {old!r}')
              write(path,text.replace(old,new))

          # product-item-images.js: publish an event only when the visible product image batch is settled.
          once('product-item-images.js',
               "let eventsBound=false;\nconst visualScaleCache=new Map();",
               "let eventsBound=false;\nlet productIdleFrame=0;\nlet productImagesIdle=false;\nconst visualScaleCache=new Map();")

          once('product-item-images.js',
               "  document.head.appendChild(style);\n}\nfunction applyVisualScale(image,source){",
               "  document.head.appendChild(style);\n}\nfunction productCardVisible(card){\n  const rect=card?.getBoundingClientRect?.();\n  if(!rect)return false;\n  const viewport=window.innerHeight||document.documentElement.clientHeight||0;\n  return rect.bottom>=0&&rect.top<=viewport;\n}\nfunction publishProductImagesIdle(){\n  if(!document.getElementById('catalogView')?.classList.contains('is-active'))return;\n  const cards=[...(products?.querySelectorAll('.product[data-name]')||[])].filter(productCardVisible);\n  const pending=cards.some(card=>{\n    const image=card.querySelector('.premium-sprite>img');\n    if(image&&!image.complete)return true;\n    return Boolean(card.querySelector('.product-svg[data-single-product-pending]'));\n  });\n  if(pending){productImagesIdle=false;return}\n  if(productImagesIdle)return;\n  productImagesIdle=true;\n  document.dispatchEvent(new CustomEvent('courses:product-images-idle',{detail:{visible:cards.length}}));\n}\nfunction scheduleProductImagesIdleCheck(){\n  if(productIdleFrame)return;\n  productIdleFrame=requestAnimationFrame(()=>{\n    productIdleFrame=0;\n    publishProductImagesIdle();\n  });\n}\nfunction bindProductImageSettle(image){\n  if(!image||image.dataset.productImageSettleBound==='1')return;\n  image.dataset.productImageSettleBound='1';\n  image.addEventListener('load',scheduleProductImagesIdleCheck);\n  image.addEventListener('error',scheduleProductImagesIdleCheck);\n}\nfunction applyVisualScale(image,source){")

          once('product-item-images.js',
               "  image.dataset.singleProductSource=source;\n  image.addEventListener('load',()=>{",
               "  image.dataset.singleProductSource=source;\n  bindProductImageSettle(image);\n  image.addEventListener('load',()=>{")

          once('product-item-images.js',
               "  const image=sprite?.querySelector(':scope > img');\n  if(!sprite||!image){decorateFallback(card,name,source,eager);return;}",
               "  const image=sprite?.querySelector(':scope > img');\n  bindProductImageSettle(image);\n  if(!sprite||!image){decorateFallback(card,name,source,eager);return;}")

          once('product-item-images.js',
               "function decorateProducts(){\n  if(!document.getElementById('catalogView')?.classList.contains('is-active'))return;\n  products?.querySelectorAll('.product[data-name]').forEach(card=>decorateCard(card,false));\n}",
               "function decorateProducts(){\n  if(!document.getElementById('catalogView')?.classList.contains('is-active'))return;\n  productImagesIdle=false;\n  products?.querySelectorAll('.product[data-name]').forEach(card=>decorateCard(card,false));\n  scheduleProductImagesIdleCheck();\n}")

          # dishes-ui.js: expose only the immutable dish names needed by the visual owner.
          once('dishes-ui.js',
               "]);\n\nconst FILTERS=['Tous','Favoris','Dessert','Enfants','Pâtes','Poissons','Poulet','Rapides','Végé','Viandes'];",
               "]);\nwindow.COURSES_DISH_NAMES=Object.freeze(DISHES.map(dish=>dish.name));\n\nconst FILTERS=['Tous','Favoris','Dessert','Enfants','Pâtes','Poissons','Poulet','Rapides','Végé','Viandes'];")

          # dish-local-images.js: one low-priority image at a time, only when catalog.js explicitly asks for it.
          replace_all('dish-local-images.js',"const APP_VERSION='v428';","const APP_VERSION='v429';",1)
          once('dish-local-images.js',
               "const DISH_PLACEHOLDER='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 650\"><rect width=\"900\" height=\"650\" fill=\"#eef1eb\"/><ellipse cx=\"450\" cy=\"330\" rx=\"250\" ry=\"170\" fill=\"#f8f7f2\" stroke=\"#cbd2c8\" stroke-width=\"12\"/><text x=\"450\" y=\"350\" text-anchor=\"middle\" font-family=\"-apple-system,BlinkMacSystemFont,Arial\" font-size=\"30\" font-weight=\"700\" fill=\"#708076\">Photo indisponible</text></svg>');\nconst slugify=value=>String(value||'')",
               "const DISH_PLACEHOLDER='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 650\"><rect width=\"900\" height=\"650\" fill=\"#eef1eb\"/><ellipse cx=\"450\" cy=\"330\" rx=\"250\" ry=\"170\" fill=\"#f8f7f2\" stroke=\"#cbd2c8\" stroke-width=\"12\"/><text x=\"450\" y=\"350\" text-anchor=\"middle\" font-family=\"-apple-system,BlinkMacSystemFont,Arial\" font-size=\"30\" font-weight=\"700\" fill=\"#708076\">Photo indisponible</text></svg>');\nlet warmQueue=[];\nlet warmScheduled=false;\nlet warmRunning=false;\nconst warmedSources=new Set();\nconst slugify=value=>String(value||'')")

          once('dish-local-images.js',
               "function localDishImage(name){\n  const slug=SPECIAL_SLUGS[name]||slugify(name);\n  return './www/Plats/'+(CHILD_DISHES.has(name)?'enfant-':'')+slug+'.png?v='+encodeURIComponent(APP_VERSION);\n}\nfunction sameImageSource(image,source){",
               "function localDishImage(name){\n  const slug=SPECIAL_SLUGS[name]||slugify(name);\n  return './www/Plats/'+(CHILD_DISHES.has(name)?'enfant-':'')+slug+'.png?v='+encodeURIComponent(APP_VERSION);\n}\nfunction scheduleWarmStep(){\n  if(warmScheduled||warmRunning||!warmQueue.length)return;\n  warmScheduled=true;\n  const run=()=>{\n    warmScheduled=false;\n    warmNextDishImage();\n  };\n  if(typeof window.requestIdleCallback==='function')window.requestIdleCallback(run,{timeout:1200});\n  else setTimeout(run,0);\n}\nfunction warmNextDishImage(){\n  if(warmRunning)return;\n  const source=warmQueue.shift();\n  if(!source)return;\n  if(warmedSources.has(source)){scheduleWarmStep();return}\n  warmRunning=true;\n  const image=new Image();\n  image.alt='';\n  image.decoding='async';\n  image.fetchPriority='low';\n  const done=()=>{\n    warmRunning=false;\n    warmedSources.add(source);\n    scheduleWarmStep();\n  };\n  image.addEventListener('load',done,{once:true});\n  image.addEventListener('error',done,{once:true});\n  image.src=source;\n}\nfunction warmDishImages(){\n  const names=Array.isArray(window.COURSES_DISH_NAMES)?window.COURSES_DISH_NAMES:[];\n  if(!names.length)return false;\n  const queued=new Set(warmQueue);\n  for(const name of names){\n    const source=localDishImage(name);\n    if(warmedSources.has(source)||queued.has(source))continue;\n    warmQueue.push(source);\n    queued.add(source);\n  }\n  scheduleWarmStep();\n  return true;\n}\nwindow.COURSES_DISH_IMAGES=Object.freeze({warm:warmDishImages});\nfunction sameImageSource(image,source){")

          # catalog.js: remember the product-image idle event so it cannot be missed while dish modules are loading.
          once('catalog.js',
               "  let dishFeaturesStarted=false;\n  let catalogExtrasStarted=false;",
               "  let dishFeaturesStarted=false;\n  let catalogExtrasStarted=false;\n  let productImagesIdle=false;")

          once('catalog.js',
               "  const loadDishAddedMarker=()=>{",
               "  const warmDishImages=()=>window.COURSES_DISH_IMAGES?.warm?.();\n  const loadDishAddedMarker=()=>{")

          once('catalog.js',
               "  const loadDishLocalImages=()=>{\n    if(document.querySelector('script[data-dish-local-images]')){loadDishAddedMarker();return}\n    const images=document.createElement('script');\n    images.src='./dish-local-images.js?v=428';\n    images.async=false;\n    images.dataset.dishLocalImages='script';\n    images.addEventListener('load',loadDishAddedMarker,{once:true});\n    document.body.appendChild(images);\n  };",
               "  const onDishLocalImagesReady=()=>{\n    loadDishAddedMarker();\n    if(productImagesIdle)warmDishImages();\n  };\n  const loadDishLocalImages=()=>{\n    if(document.querySelector('script[data-dish-local-images]')){onDishLocalImagesReady();return}\n    const images=document.createElement('script');\n    images.src='./dish-local-images.js?v=429';\n    images.async=false;\n    images.dataset.dishLocalImages='script';\n    images.addEventListener('load',onDishLocalImagesReady,{once:true});\n    document.body.appendChild(images);\n  };")

          replace_all('catalog.js',"script.src='./dishes-ui.js?v=428';","script.src='./dishes-ui.js?v=429';",1)
          replace_all('catalog.js',"script.src='./runtime-features.js?v=428';","script.src='./runtime-features.js?v=429';",1)

          once('catalog.js',
               "  document.addEventListener('courses:view-changed',event=>{",
               "  document.addEventListener('courses:product-images-idle',()=>{\n    productImagesIdle=true;\n    warmDishImages();\n  });\n  document.addEventListener('courses:view-changed',event=>{")

          # runtime graph revisions.
          replace_all('runtime-features.js',"script.src='./product-item-images.js?v=428';","script.src='./product-item-images.js?v=429';",1)

          # Global visible version and entry-point revision. Unchanged app/settings modules retain v428.
          replace_all('index.html','<span class="page-version">v428</span>','<span class="page-version">v429</span>',3)
          replace_all('index.html','./catalog.js?v=428','./catalog.js?v=429',1)

          sw=read('sw.js')
          replacements={
              "const CACHE='courses-app-v428-r1';":"const CACHE='courses-app-v429-r1';",
              './catalog.js?v=428':'./catalog.js?v=429',
              './dishes-ui.js?v=428':'./dishes-ui.js?v=429',
              './dish-local-images.js?v=428':'./dish-local-images.js?v=429',
              './runtime-features.js?v=428':'./runtime-features.js?v=429',
              './product-item-images.js?v=428':'./product-item-images.js?v=429',
          }
          for old,new in replacements.items():
              if sw.count(old)!=1: raise SystemExit(f'sw.js: expected one {old!r}, got {sw.count(old)}')
              sw=sw.replace(old,new,1)
          write('sw.js',sw)

          # Documentation of the event-driven priority pipeline.
          once('docs/ASSET_GRAPH.md',
               "`runtime-features.js` charge `missing-products-fixes.js`, `missing-products-popup-ui.js`, `product-item-images.js` et `purchase-intelligence.js`. `product-item-images.js` ne charge plus l’administration du catalogue et ne décore le Catalogue que lorsqu’il est visible.",
               "`runtime-features.js` charge `missing-products-fixes.js`, `missing-products-popup-ui.js`, `product-item-images.js` et `purchase-intelligence.js`. `product-item-images.js` ne charge plus l’administration du catalogue et ne décore le Catalogue que lorsqu’il est visible. Quand le lot de visuels Produits actuellement visible est terminé (chargé ou en erreur), il publie `courses:product-images-idle`. `catalog.js` autorise alors `dish-local-images.js` à précharger les visuels Plats un par un et en basse priorité ; l’affichage des cartes Plats reste en `loading=\"lazy\"` et n’est jamais déclenché automatiquement.")

          # Version graph test: only changed modules advance to v429.
          text=read('tests/list-render-version.test.mjs')
          text=text.replace("assert.equal(version,'v428');","assert.equal(version,'v429');")
          text=text.replace("  assert.ok(index.includes(`./app.js?v=${revision}`));","  assert.match(index,/\\.\\/app\\.js\\?v=428/);")
          text=text.replace("  assert.ok(index.includes(`./settings-ui.js?v=${revision}`));","  assert.match(index,/\\.\\/settings-ui\\.js\\?v=428/);")
          text=text.replace("  assert.ok(sw.includes(`./app.js?v=${revision}`));","  assert.match(sw,/\\.\\/app\\.js\\?v=428/);")
          text=text.replace("  assert.ok(sw.includes(`./settings-ui.js?v=${revision}`));","  assert.match(sw,/\\.\\/settings-ui\\.js\\?v=428/);")
          write('tests/list-render-version.test.mjs',text)

          # Deferred/offline graph reflects changed module revisions while preserving v428 app/settings.
          text=read('tests/deferred-catalog-startup.test.mjs')
          text=text.replace("['dishes-ui.js?v=428','catalog-quantities.js?v=426','catalog-liquid.js?v=297','dish-local-images.js?v=428','dish-added-marker.js?v=408','repurchase-soon.js?v=410','catalog-product-admin.js?v=410']",
                            "['dishes-ui.js?v=429','catalog-quantities.js?v=426','catalog-liquid.js?v=297','dish-local-images.js?v=429','dish-added-marker.js?v=408','repurchase-soon.js?v=410','catalog-product-admin.js?v=410']")
          text=text.replace("['catalog.js?v=428','app.js?v=428','settings-ui.js?v=428','runtime-features.js?v=428','product-item-images.js?v=428']",
                            "['catalog.js?v=429','app.js?v=428','settings-ui.js?v=428','runtime-features.js?v=429','product-item-images.js?v=429']")
          write('tests/deferred-catalog-startup.test.mjs',text)

          # Replace the old no-warmup invariant with the explicitly requested conditional pipeline.
          write('tests/dish-image-loading.test.mjs',"""import assert from 'node:assert/strict';
import {readFileSync} from 'node:fs';
import test from 'node:test';

const read=file=>readFileSync(new URL('../'+file,import.meta.url),'utf8');

test('les cartes de plats restent lazy et le warmup attend la fin du lot Produits visible',()=>{
  const products=read('product-item-images.js');
  const catalog=read('catalog.js');
  const dishes=read('dishes-ui.js');
  const images=read('dish-local-images.js');
  assert.match(dishes,/loading=\"lazy\" decoding=\"async\"/);
  assert.match(products,/new CustomEvent\\('courses:product-images-idle'/);
  assert.match(products,/filter\\(productCardVisible\\)/);
  assert.match(products,/if\\(pending\\)\\{productImagesIdle=false;return\\}/);
  assert.match(catalog,/document\\.addEventListener\\('courses:product-images-idle',\\(\\)=>\\{/);
  assert.match(catalog,/productImagesIdle=true;\\s*warmDishImages\\(\\);/);
  assert.match(dishes,/window\\.COURSES_DISH_NAMES=Object\\.freeze\\(DISHES\\.map\\(dish=>dish\\.name\\)\\)/);
  assert.match(images,/window\\.COURSES_DISH_IMAGES=Object\\.freeze\\(\\{warm:warmDishImages\\}\\)/);
  assert.match(images,/image\\.fetchPriority='low'/);
  assert.match(images,/window\\.requestIdleCallback/);
  assert.match(images,/new Image\\(\\)/);
  assert.doesNotMatch(images,/setInterval\\(|MutationObserver/);
});

test('le préchargement Plats reste événementiel et ne revient pas dans le démarrage critique',()=>{
  const catalog=read('catalog.js');
  const start=catalog.indexOf('const bootstrap=()=>{');
  const end=catalog.indexOf("if(document.readyState==='loading')",start);
  const bootstrap=catalog.slice(start,end);
  assert.ok(start>=0&&end>start);
  assert.doesNotMatch(bootstrap,/warmDishImages\\(\\)|loadDishLocalImages\\(\\)|startDishFeatures\\(\\)/);
  assert.doesNotMatch(catalog,/setInterval\\(|new MutationObserver/);
});
""")

          # Add a focused regression test for product priority and missed-event protection.
          write('tests/image-loading-pipeline.test.mjs',"""import assert from 'node:assert/strict';
import {readFileSync} from 'node:fs';
import test from 'node:test';

const read=file=>readFileSync(new URL('../'+file,import.meta.url),'utf8');

test('le pipeline visuel respecte Produits puis Plats sans dépendre d un timer permanent',()=>{
  const products=read('product-item-images.js');
  const catalog=read('catalog.js');
  const dishImages=read('dish-local-images.js');
  assert.match(products,/function publishProductImagesIdle\\(\\)/);
  assert.match(products,/const pending=cards\\.some/);
  assert.match(products,/scheduleProductImagesIdleCheck\\(\\);/);
  assert.match(catalog,/let productImagesIdle=false;/);
  assert.match(catalog,/const onDishLocalImagesReady=\\(\\)=>\\{/);
  assert.match(catalog,/if\\(productImagesIdle\\)warmDishImages\\(\\);/);
  assert.match(dishImages,/function warmNextDishImage\\(\\)/);
  assert.match(dishImages,/warmRunning=true;/);
  assert.match(dishImages,/scheduleWarmStep\\(\\);/);
  assert.doesNotMatch(products,/setInterval\\(|MutationObserver/);
  assert.doesNotMatch(dishImages,/setInterval\\(|MutationObserver/);
});
""")
          PY
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        shell: bash
        run: |
          rm .github/workflows/v429-dish-image-pipeline-work.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v429: précharge les plats après les visuels produits"
          git push origin HEAD:automation/v429-dish-image-pipeline-work
