name: v428 catalog flow work

on:
  push:
    branches:
      - automation/v428-catalog-flow-work

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited v428 refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text=read(path)
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old[:80]!r}')
              write(path,text.replace(old,new,1))

          # catalog.js: product preparation is independent from dishes; catalog-only extras start on catalog entry.
          path='catalog.js'
          text=read(path)
          marker="\n(() => {\n  'use strict';\n\n  const style=document.createElement('link');"
          pos=text.find(marker)
          if pos<0:
              raise SystemExit('catalog.js loader marker not found')
          tail=r'''(() => {
