name: ChatGPT restore existing dish visuals

on:
  push:
    branches: [chatgpt-integrate-sushis-saucisse-lentille]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Reassemble existing generated visuals
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/sushis.jpg
          for part in .chatgpt/sushi.part*.b64; do base64 -d "$part" >> /tmp/sushis.jpg; done
          : > /tmp/saucisse-lentille.jpg
          for part in .chatgpt/saucisse.part*.b64; do base64 -d "$part" >> /tmp/saucisse-lentille.jpg; done
          test -s /tmp/sushis.jpg
          test -s /tmp/saucisse-lentille.jpg

      - name: Prepare image conversion
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Switch to current main safely
        shell: bash
        env:
          EXPECTED_HEAD: 5a6eed2b894d4ba96fcc99ffcd2c47e39dc87838
        run: |
          set -euo pipefail
          git fetch --depth=20 origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_HEAD"
          git checkout -B main origin/main

      - name: Restore both visuals and bump v452
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import re

          for path in (Path('www/Plats/sushis.png'),Path('www/Plats/saucisse-lentille.png')):
            if path.exists(): raise SystemExit(f'Visuel déjà présent: {path}')

          dishes=Path('dishes-ui.js').read_text(encoding='utf-8')
          for name in ('Sushis','Saucisse lentille'):
            if not re.search(r"\{name:'"+re.escape(name)+r"'",dishes):
              raise SystemExit(f'Plat absent: {name}')

          local_path=Path('dish-local-images.js')
          local=local_path.read_text(encoding='utf-8')
          local,count=re.subn(r"const APP_VERSION='v451'","const APP_VERSION='v452'",local,count=1)
          if count!=1: raise SystemExit('Version v451 introuvable dans dish-local-images.js')
          local_path.write_text(local,encoding='utf-8')

          catalog_path=Path('catalog.js')
          catalog=catalog_path.read_text(encoding='utf-8')
          catalog,count=re.subn(r"dish-local-images\.js\?v=451","dish-local-images.js?v=452",catalog,count=1)
          if count!=1: raise SystemExit('Révision dish-local-images v451 introuvable dans catalog.js')
          catalog_path.write_text(catalog,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          if index.count('<span class="page-version">v451</span>')!=3:
            raise SystemExit('Badges v451 inattendus dans index.html')
          index=index.replace('<span class="page-version">v451</span>','<span class="page-version">v452</span>')
          index,count=re.subn(r"catalog\.js\?v=451","catalog.js?v=452",index,count=1)
          if count!=1: raise SystemExit('Révision catalog v451 introuvable dans index.html')
          index_path.write_text(index,encoding='utf-8')

          sw_path=Path('sw.js')
          sw=sw_path.read_text(encoding='utf-8')
          sw,count=re.subn(r"const CACHE='courses-app-v451-r1'","const CACHE='courses-app-v452-r1'",sw,count=1)
          if count!=1: raise SystemExit('Cache v451 introuvable dans sw.js')
          sw,count_catalog=re.subn(r"\./catalog\.js\?v=451","./catalog.js?v=452",sw,count=1)
          sw,count_images=re.subn(r"\./dish-local-images\.js\?v=451","./dish-local-images.js?v=452",sw,count=1)
          if count_catalog!=1 or count_images!=1:
            raise SystemExit('Révisions v451 inattendues dans le shell du service worker')
          sw_path.write_text(sw,encoding='utf-8')

          for source,target in [('/tmp/sushis.jpg',Path('www/Plats/sushis.png')),('/tmp/saucisse-lentille.jpg',Path('www/Plats/saucisse-lentille.png'))]:
            image=Image.open(source).convert('RGB').resize((1536,1024),Image.Resampling.LANCZOS)
            image.save(target,'PNG',optimize=True)
            with Image.open(target) as check:
              if check.format!='PNG' or check.size!=(1536,1024):
                raise SystemExit(f'Visuel invalide: {target}')

      - name: Validate and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate_repo.sh
          test -s www/Plats/sushis.png
          test -s www/Plats/saucisse-lentille.png
          grep -Fq "const APP_VERSION='v452'" dish-local-images.js
          test "$(grep -o '<span class="page-version">v452</span>' index.html | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js dish-local-images.js index.html sw.js www/Plats/sushis.png www/Plats/saucisse-lentille.png
          git diff --cached --check
          git commit -m "v452: restaure les visuels Sushis et Saucisse lentille"
          git push origin HEAD:main
