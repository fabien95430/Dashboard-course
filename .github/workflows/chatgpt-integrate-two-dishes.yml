name: ChatGPT restore existing dish visual

on:
  push:
    branches: [chatgpt-integrate-sushis-saucisse-lentille]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Prepare image recovery
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Reassemble and validate existing Sushis visual
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import base64, io

          root=Path('.chatgpt')
          names=[
              'sushi.part000.b64','sushi.part001.b64','sushi.part002.b64','sushi.part003.b64',
              'sushi.part004a.b64','sushi.part004b.b64','sushi.part004c.b64'
          ]
          encoded=''.join(''.join((root/name).read_text(encoding='utf-8').split()) for name in names)
          data=base64.b64decode(encoded,validate=True)
          with Image.open(io.BytesIO(data)) as image:
              image.verify()
          with Image.open(io.BytesIO(data)) as image:
              if image.format!='JPEG' or image.size!=(512,341):
                  raise SystemExit(f'Visuel historique inattendu: {image.format} {image.size}')
          Path('/tmp/sushis.jpg').write_bytes(data)

      - name: Switch to current main safely
        shell: bash
        env:
          EXPECTED_HEAD: 5a6eed2b894d4ba96fcc99ffcd2c47e39dc87838
        run: |
          set -euo pipefail
          git fetch --depth=20 origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_HEAD"
          git checkout -B main origin/main

      - name: Restore Sushis visual and bump v452
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import re

          target=Path('www/Plats/sushis.png')
          if target.exists():
              raise SystemExit(f'Visuel déjà présent: {target}')

          dishes=Path('dishes-ui.js').read_text(encoding='utf-8')
          if not re.search(r"\{name:'Sushis'",dishes):
              raise SystemExit('Plat Sushis absent')

          local_path=Path('dish-local-images.js')
          local=local_path.read_text(encoding='utf-8')
          local,count=re.subn(r"const APP_VERSION='v451'","const APP_VERSION='v452'",local,count=1)
          if count!=1:
              raise SystemExit('Version v451 introuvable dans dish-local-images.js')
          local_path.write_text(local,encoding='utf-8')

          catalog_path=Path('catalog.js')
          catalog=catalog_path.read_text(encoding='utf-8')
          catalog,count=re.subn(r"dish-local-images\.js\?v=451","dish-local-images.js?v=452",catalog,count=1)
          if count!=1:
              raise SystemExit('Révision dish-local-images v451 introuvable dans catalog.js')
          catalog_path.write_text(catalog,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          if index.count('<span class="page-version">v451</span>')!=3:
              raise SystemExit('Badges v451 inattendus dans index.html')
          index=index.replace('<span class="page-version">v451</span>','<span class="page-version">v452</span>')
          index,count=re.subn(r"catalog\.js\?v=451","catalog.js?v=452",index,count=1)
          if count!=1:
              raise SystemExit('Révision catalog v451 introuvable dans index.html')
          index_path.write_text(index,encoding='utf-8')

          sw_path=Path('sw.js')
          sw=sw_path.read_text(encoding='utf-8')
          sw,count=re.subn(r"const CACHE='courses-app-v451-r1'","const CACHE='courses-app-v452-r1'",sw,count=1)
          if count!=1:
              raise SystemExit('Cache v451 introuvable dans sw.js')
          sw,count_catalog=re.subn(r"\./catalog\.js\?v=451","./catalog.js?v=452",sw,count=1)
          sw,count_images=re.subn(r"\./dish-local-images\.js\?v=451","./dish-local-images.js?v=452",sw,count=1)
          if count_catalog!=1 or count_images!=1:
              raise SystemExit('Révisions v451 inattendues dans le shell du service worker')
          sw_path.write_text(sw,encoding='utf-8')

          image=Image.open('/tmp/sushis.jpg').convert('RGB').resize((1536,1024),Image.Resampling.LANCZOS)
          image.save(target,'PNG',optimize=True)
          with Image.open(target) as check:
              if check.format!='PNG' or check.size!=(1536,1024):
                  raise SystemExit(f'Visuel final invalide: {check.format} {check.size}')

      - name: Validate and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate_repo.sh
          test -s www/Plats/sushis.png
          grep -Fq "const APP_VERSION='v452'" dish-local-images.js
          test "$(grep -o '<span class="page-version">v452</span>' index.html | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js dish-local-images.js index.html sw.js www/Plats/sushis.png
          git diff --cached --check
          git commit -m "v452: restaure le visuel Sushis"
          git push origin HEAD:main
