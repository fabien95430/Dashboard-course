name: Build welcome background
on:
  push:
    branches:
      - welcome-background-image-v40

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[bg-built]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout welcome-background-image-v40

      - name: Build generated background
        run: |
          cd repo
          cat tmp/welcome-bg/part*.txt | base64 -d > welcome-background-v40.webp
          test "$(wc -c < welcome-background-v40.webp)" -eq 24152
          echo "da14e8869adf3d6cfe33cc95dfc51ff4228b817c6a51c9835e14ccddcc1d3b2c  welcome-background-v40.webp" | sha256sum -c -

      - name: Commit generated image
        run: |
          cd repo
          rm -rf tmp/welcome-bg
          rm -f .github/workflows/build-welcome-background.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated welcome background [bg-built]"
          git push origin welcome-background-image-v40
