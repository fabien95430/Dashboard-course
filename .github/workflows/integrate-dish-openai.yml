name: Intégrer ou administrer le catalogue
run-name: Courses · ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [courses_dish_openai_request]

permissions:
  contents: write

concurrency:
  group: courses-openai-integration
  cancel-in-progress: false
  queue: max

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISH_NAME: ${{ github.event.client_payload.name }}
      DISH_CATEGORY: ${{ github.event.client_payload.category }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      TEMP_BRANCH: automation/item-${{ github.run_id }}
      COURSES_BASE_URL: https://fabien95430.github.io/Dashboard-course/
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COURSES_VAPID_PRIVATE_KEY: ${{ secrets.COURSES_VAPID_PRIVATE_KEY }}

    steps:
      - name: Masquer la souscription Web Push
        shell: python
        run: |
          import json, os
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          payload=event.get('client_payload') or {}
          fields={
              'PUSH_ENDPOINT':'push_endpoint',
              'PUSH_P256DH':'push_p256dh',
              'PUSH_AUTH':'push_auth',
              'PUSH_PUBLIC_KEY':'push_public_key',
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              for env_name,payload_name in fields.items():
                  value=''.join(str(payload.get(payload_name) or '').splitlines()).strip()
                  if not value:
                      continue
                  print(f'::add-mask::{value}')
                  env.write(f'{env_name}={value}\n')

      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Préparer Node pour le Web Push
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Identifier la demande
        id: request
        shell: python
        run: |
          import hashlib, json, os
          raw=str(os.environ.get('DISH_NAME') or '').strip()
          context=str(os.environ.get('DISH_CATEGORY') or '').strip()
          product_prefix='__courses_product__:'
          delete_prefix='__courses_delete_product__:'
          if raw.startswith(delete_prefix):
              item_type='delete_product'
              item_name=raw[len(delete_prefix):].strip()
          elif raw.startswith(product_prefix):
              item_type='product'
              item_name=raw[len(product_prefix):].strip()
          else:
              item_type='dish'
              item_name=raw
          if not item_name:
              raise SystemExit('Nom de demande manquant')
          checkpoint_key=''
          checkpoint_branch=''
          if item_type in {'product','dish'}:
              fingerprint=json.dumps([item_type,item_name,context],ensure_ascii=False,separators=(',',':'))
              checkpoint_key=hashlib.sha256(fingerprint.encode('utf-8')).hexdigest()[:24]
              checkpoint_branch='automation/openai-checkpoint-'+checkpoint_key
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"type={item_type}\n")
              out.write(f"name={item_name}\n")
              out.write(f"checkpoint_key={checkpoint_key}\n")
              out.write(f"checkpoint_branch={checkpoint_branch}\n")

      - name: Restaurer une génération OpenAI conservée
        id: checkpoint_restore
        if: steps.request.outputs.checkpoint_branch != ''
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.request.outputs.checkpoint_branch }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$branch"
            rm -rf .courses-openai-checkpoint
            git archive FETCH_HEAD .courses-openai-checkpoint | tar -x
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "Checkpoint OpenAI restauré depuis $branch"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Traiter la demande
        id: integrate
        continue-on-error: true
        env:
          COURSES_CHECKPOINT_KEY: ${{ steps.request.outputs.checkpoint_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.request.outputs.type }}" = "delete_product" ]; then
            python3 scripts/manage_product_catalog.py
          elif [ "${{ steps.request.outputs.type }}" = "product" ]; then
            python3 scripts/run_openai_integration.py product
          else
            python3 scripts/run_openai_integration.py dish
          fi

      - name: Valider le visuel généré
        id: asset
        if: steps.integrate.outcome == 'success' && steps.request.outputs.type != 'delete_product'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_generated_asset.py "${{ steps.request.outputs.type }}"

      - name: Invalider uniquement le visuel du checkpoint
        if: steps.asset.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .courses-openai-checkpoint ]; then
            find .courses-openai-checkpoint -maxdepth 1 -type f \( -name '*-image.json' -o -name '*-image.bin' \) -delete
          fi

      - name: Conserver la génération OpenAI pour une relance
        id: checkpoint
        if: always() && steps.request.outputs.checkpoint_branch != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .courses-openai-checkpoint ] || [ -z "$(find .courses-openai-checkpoint -maxdepth 1 -type f -print -quit)" ]; then
            echo "saved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ steps.request.outputs.checkpoint_branch }}"
          checkpoint_index="$(mktemp)"
          rm -f "$checkpoint_index"
          GIT_INDEX_FILE="$checkpoint_index" git add -f .courses-openai-checkpoint
          checkpoint_tree="$(GIT_INDEX_FILE="$checkpoint_index" git write-tree)"
          checkpoint_commit="$(printf '%s\n' "Checkpoint OpenAI ${{ steps.request.outputs.checkpoint_key }}" | git commit-tree "$checkpoint_tree")"
          git push --force origin "$checkpoint_commit:refs/heads/$branch"
          rm -f "$checkpoint_index"
          echo "saved=true" >> "$GITHUB_OUTPUT"
          echo "Checkpoint OpenAI conservé sur $branch"

      - name: Lire le résultat
        id: result
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          data={}
          path=Path('.courses-dish-result.json')
          if path.exists():
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception: pass
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key in ('ok','deleted','already_exists','version','filename','name','error'):
                  value=data.get(key,'')
                  if isinstance(value,bool):
                      value=str(value).lower()
                  else:
                      value=' '.join(str(value).split())
                  if key=='error':
                      value=value[:1000]
                  out.write(f"{key}={value}\n")

      - name: Sauvegarder la modification sur une branche temporaire
        id: preserve
        if: steps.integrate.outcome == 'success' && steps.result.outputs.ok == 'true' && steps.result.outputs.already_exists != 'true' && (steps.request.outputs.type == 'delete_product' || steps.asset.outcome == 'success') && (steps.request.outputs.type == 'delete_product' || steps.checkpoint.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$TEMP_BRANCH"
          if [ "${{ steps.request.outputs.type }}" = "delete_product" ]; then
            git add catalog.js app.js catalog-quantities.js purchase-intelligence.js index.html dish-local-images.js sw.js
            image="www/Items/${{ steps.result.outputs.filename }}"
            if git ls-files --error-unmatch "$image" >/dev/null 2>&1; then
              git add -A "$image"
            fi
            message="v${{ steps.result.outputs.version }}: supprime le produit ${{ steps.request.outputs.name }} du catalogue"
          elif [ "${{ steps.request.outputs.type }}" = "product" ]; then
            git add catalog.js app.js catalog-quantities.js index.html product-item-images.js dish-local-images.js sw.js "www/Items/${{ steps.result.outputs.filename }}"
            message="v${{ steps.result.outputs.version }}: ajoute le produit ${{ steps.request.outputs.name }} via OpenAI"
          else
            git add catalog.js index.html dishes-ui.js dish-local-images.js sw.js "www/Plats/${{ steps.result.outputs.filename }}"
            message="v${{ steps.result.outputs.version }}: ajoute le plat ${{ steps.request.outputs.name }} via OpenAI"
          fi
          git diff --cached --check
          git commit -m "$message"
          git push -u origin HEAD:"$TEMP_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Modification conservée sur $TEMP_BRANCH"

      - name: Rebaser, valider et publier sur main
        id: commit
        if: steps.preserve.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflit avec main : la modification reste conservée sur $TEMP_BRANCH." >&2
              exit 1
            fi
            bash scripts/validate_repo.sh
            git push --force-with-lease origin HEAD:"$TEMP_BRANCH"
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main a encore changé, nouvelle tentative ($attempt/3)."
          done
          echo "main a trop changé pendant la publication ; la modification reste conservée sur $TEMP_BRANCH." >&2
          exit 1

      - name: Confirmer le déploiement GitHub Pages
        id: deploy
        if: steps.integrate.outcome == 'success' && steps.result.outputs.ok == 'true' && (steps.request.outputs.type == 'delete_product' || steps.asset.outcome == 'success') && (steps.result.outputs.already_exists == 'true' || steps.commit.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.result.outputs.version }}"
          file="${{ steps.result.outputs.filename }}"
          if [ "${{ steps.request.outputs.type }}" = "delete_product" ]; then
            asset="www/Items/${file}"
            for attempt in $(seq 1 36); do
              version_body="$(curl -fsSL --max-time 12 "${COURSES_BASE_URL}dish-local-images.js?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
              asset_status="$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 12 "${COURSES_BASE_URL}${asset}?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
              if printf '%s' "$version_body" | grep -Fq "const APP_VERSION='v${version}'" \
                && [ "$asset_status" = "404" ]; then
                echo "Suppression v${version} confirmée."
                exit 0
              fi
              sleep 10
            done
          else
            if [ "${{ steps.request.outputs.type }}" = "product" ]; then
              asset="www/Items/${file}"
            else
              asset="www/Plats/${file}"
            fi
            for attempt in $(seq 1 36); do
              version_body="$(curl -fsSL --max-time 12 "${COURSES_BASE_URL}dish-local-images.js?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
              if printf '%s' "$version_body" | grep -Fq "const APP_VERSION='v${version}'" \
                && curl -fsSIL --max-time 12 "${COURSES_BASE_URL}${asset}?courses_deploy=${GITHUB_RUN_ID}-${attempt}" >/dev/null; then
                echo "Déploiement v${version} confirmé."
                exit 0
              fi
              sleep 10
            done
          fi
          echo "Le déploiement GitHub Pages n'a pas été confirmé." >&2
          exit 1

      - name: Supprimer la branche temporaire après publication
        if: steps.preserve.outcome == 'success' && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: git push origin --delete "$TEMP_BRANCH"

      - name: Supprimer le checkpoint OpenAI après publication
        if: steps.deploy.outcome == 'success' && steps.request.outputs.checkpoint_branch != ''
        continue-on-error: true
        shell: bash
        run: |
          branch="${{ steps.request.outputs.checkpoint_branch }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi

      - name: Installer l'émetteur Web Push
        if: always() && env.PUSH_ENDPOINT != ''
        run: npm install --no-save --no-package-lock web-push@3.6.7

      - name: Notification Courses — succès
        if: steps.integrate.outcome == 'success' && steps.deploy.outcome == 'success' && env.PUSH_ENDPOINT != ''
        env:
          PUSH_STATUS: added
        run: node scripts/send_web_push.mjs

      - name: Notification Courses — erreur
        if: always() && (steps.integrate.outcome != 'success' || steps.deploy.outcome != 'success') && env.PUSH_ENDPOINT != ''
        env:
          PUSH_STATUS: error
          PUSH_ERROR: ${{ steps.result.outputs.error }}
          PUSH_STAGE: ${{ steps.integrate.outcome != 'success' && 'integration' || steps.asset.outcome == 'failure' && 'validation' || steps.checkpoint.outcome == 'failure' && 'checkpoint' || 'deployment' }}
        run: node scripts/send_web_push.mjs

      - name: Signaler un échec
        if: always() && (steps.integrate.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1
