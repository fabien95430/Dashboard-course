name: Intégrer un produit ou plat via OpenAI
run-name: OpenAI · ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [courses_dish_openai_request]

permissions:
  contents: write

concurrency:
  group: courses-openai-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISH_NAME: ${{ github.event.client_payload.name }}
      DISH_CATEGORY: ${{ github.event.client_payload.category }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      TEMP_BRANCH: openai/item-${{ github.run_id }}
      PUSH_ENDPOINT: ${{ github.event.client_payload.push_endpoint }}
      PUSH_P256DH: ${{ github.event.client_payload.push_p256dh }}
      PUSH_AUTH: ${{ github.event.client_payload.push_auth }}
      PUSH_PUBLIC_KEY: ${{ github.event.client_payload.push_public_key }}
      COURSES_BASE_URL: https://fabien95430.github.io/Dashboard-course/
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COURSES_VAPID_PRIVATE_KEY: ${{ secrets.COURSES_VAPID_PRIVATE_KEY }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Préparer Node pour le Web Push
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Identifier la demande
        id: request
        shell: python
        run: |
          import os
          raw=str(os.environ.get('DISH_NAME') or '').strip()
          prefix='__courses_product__:'
          item_type='product' if raw.startswith(prefix) else 'dish'
          item_name=raw[len(prefix):].strip() if item_type=='product' else raw
          if not item_name:
              raise SystemExit('Nom de demande manquant')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"type={item_type}\n")
              out.write(f"name={item_name}\n")

      - name: Générer et intégrer la demande
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.request.outputs.type }}" = "product" ]; then
            python3 scripts/integrate_product_openai.py
          else
            python3 scripts/integrate_dish_openai.py
          fi

      - name: Lire le résultat
        id: result
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          data={}
          path=Path('.courses-dish-result.json')
          if path.exists():
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception: pass
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key in ('ok','already_exists','version','filename','name'):
                  value=data.get(key,'')
                  out.write(f"{key}={str(value).lower() if isinstance(value,bool) else value}\n")

      - name: Sauvegarder la génération sur une branche temporaire
        id: preserve
        if: steps.integrate.outcome == 'success' && steps.result.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$TEMP_BRANCH"
          if [ "${{ steps.request.outputs.type }}" = "product" ]; then
            git add catalog.js dish-local-images.js sw.js "www/Items/${{ steps.result.outputs.filename }}"
            label="produit"
          else
            git add dishes-ui.js dish-local-images.js sw.js "www/Plats/${{ steps.result.outputs.filename }}"
            label="plat"
          fi
          git diff --cached --check
          git commit -m "v${{ steps.result.outputs.version }}: ajoute le ${label} ${{ steps.request.outputs.name }} via OpenAI"
          git push -u origin HEAD:"$TEMP_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Génération conservée sur $TEMP_BRANCH"

      - name: Rebaser et publier sur main
        id: commit
        if: steps.preserve.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflit avec main : la génération reste conservée sur $TEMP_BRANCH." >&2
              exit 1
            fi
            git push --force-with-lease origin HEAD:"$TEMP_BRANCH"
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main a encore changé, nouvelle tentative ($attempt/3)."
          done
          echo "main a trop changé pendant la publication ; la génération reste conservée sur $TEMP_BRANCH." >&2
          exit 1

      - name: Confirmer le déploiement GitHub Pages
        id: deploy
        if: steps.integrate.outcome == 'success' && (steps.result.outputs.already_exists == 'true' || steps.commit.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.result.outputs.version }}"
          file="${{ steps.result.outputs.filename }}"
          if [ "${{ steps.request.outputs.type }}" = "product" ]; then
            asset="www/Items/${file}"
          else
            asset="www/Plats/${file}"
          fi
          for attempt in $(seq 1 36); do
            version_body="$(curl -fsSL --max-time 12 "${COURSES_BASE_URL}dish-local-images.js?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
            if printf '%s' "$version_body" | grep -Fq "const APP_VERSION='v${version}'" \
              && curl -fsSIL --max-time 12 "${COURSES_BASE_URL}${asset}?courses_deploy=${GITHUB_RUN_ID}-${attempt}" >/dev/null; then
              echo "Déploiement v${version} confirmé."
              exit 0
            fi
            sleep 10
          done
          echo "Le déploiement GitHub Pages n'a pas été confirmé." >&2
          exit 1

      - name: Supprimer la branche temporaire après publication
        if: steps.preserve.outcome == 'success' && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: git push origin --delete "$TEMP_BRANCH"

      - name: Installer l'émetteur Web Push
        if: always()
        run: npm install --no-save --no-package-lock web-push@3.6.7

      - name: Notification Courses — succès
        if: steps.integrate.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          PUSH_STATUS: added
        run: node scripts/send_web_push.mjs

      - name: Notification Courses — erreur
        if: always() && (steps.integrate.outcome != 'success' || steps.deploy.outcome != 'success')
        env:
          PUSH_STATUS: error
        run: node scripts/send_web_push.mjs

      - name: Signaler un échec d'intégration
        if: always() && (steps.integrate.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1
