name: Temporary WebP optimization (branch only)
on:
  push:
    branches:
      - agent/optimize-heavy-webp-20261029
    paths:
      - scripts/_temporary_optimize_heavy_webp.py
permissions:
  contents: write
jobs:
  optimize:
    if: github.ref == 'refs/heads/agent/optimize-heavy-webp-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install temporary build-only encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Optimize existing heavy WebP assets with strict checks
        run: python scripts/_temporary_optimize_heavy_webp.py
      - name: Run repository validation
        run: bash scripts/validate_repo.sh
      - name: Prepare atomic optimization commit without temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/_temporary_optimize_heavy_webp.yml scripts/_temporary_optimize_heavy_webp.py
          git add index.html catalog.js dish-local-images.js sw.js docs/IMAGE_OPTIMIZATION_V*.md
          git add -u www/Items/
          git diff --cached --check
          git config user.name 'Course image optimizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Optimize heavy product WebP images with pixel-level checks"
          git push origin HEAD:refs/heads/agent/optimize-heavy-webp-20261029
