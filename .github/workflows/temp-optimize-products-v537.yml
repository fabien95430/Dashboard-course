name: TEMP optimize oversized product images
on:
  push:
    branches:
      - quality/optimize-heavy-images-v537

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/optimize-heavy-images-v537
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary image conversion tooling
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Compress and verify 32 local product WebP images
        run: python tools/optimize-heavy-products-v537.py
      - name: Commit compressed images only on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/Items
          count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$count" = "32"
          git diff --cached --name-only | grep -v '^www/Items/.*\.webp$' && exit 1 || true
          git commit -m 'work: optimize 32 oversized WebP product images'
          git push origin HEAD:quality/optimize-heavy-images-v537
