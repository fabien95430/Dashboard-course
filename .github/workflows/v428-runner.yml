name: v428 runner

on:
  push:
    branches: [automation/v428-catalog-flow-work]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/v428-catalog-flow-work.yml').read_text(encoding='utf-8')
          marker="          python <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY\n",start)
          script=textwrap.dedent(source[start:end])
          script=script.replace("})()'''","})();'''",1)
          exec(compile(script,'v428-apply.py','exec'),{})
          PYRUN
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        shell: bash
        run: |
          rm .github/workflows/v428-catalog-flow-work.yml .github/workflows/v428-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v428: sépare réellement Ma liste, Produits et Plats"
          git push origin HEAD:automation/v428-catalog-flow-work
