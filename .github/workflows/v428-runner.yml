name: v428 runner

on:
  push:
    branches: [automation/v428-catalog-flow-work]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited v428 patch
        run: python scripts/v428_finalize.py
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        shell: bash
        run: |
          rm .github/workflows/v428-catalog-flow-work.yml .github/workflows/v428-runner.yml scripts/v428_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v428: sépare réellement Ma liste, Produits et Plats"
          git push origin HEAD:automation/v428-catalog-flow-work
