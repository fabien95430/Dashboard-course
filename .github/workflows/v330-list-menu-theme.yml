name: Accelerate catalog quantities

on:
  push:
    branches:
      - agent-final-v318
    paths:
      - .github/workflows/v330-list-menu-theme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify expected main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1b577c113518435a1cb5a3e619bcce5710d1bf7b"

      - name: Apply catalog quantity queue
        shell: python
        run: |
          from pathlib import Path
          import re, textwrap

          V=345
          version=f'v{V}'

          app_path=Path('app.js')
          app=app_path.read_text(encoding='utf-8')

          old="  const add=card.querySelector('.badge');if(add)add.onclick=()=>incrementProduct(product.name);\n  const remove=card.querySelector('.media');if(remove)remove.onclick=()=>decrementProduct(product.name);"
          new="  const add=card.querySelector('.badge');if(add)add.onclick=()=>queueCatalogQuantityChange(product.name,1);\n  const remove=card.querySelector('.media');if(remove)remove.onclick=()=>queueCatalogQuantityChange(product.name,-1);"
          if app.count(old)!=1: raise SystemExit(f'catalog click handlers: {app.count(old)}')
          app=app.replace(old,new,1)

          old="    updateProductCardQuantity(card,product.name,quantities.get(norm(product.name))||0);"
          new="    updateProductCardQuantity(card,product.name,catalogQuantityForDisplay(product.name,quantities.get(norm(product.name))||0));"
          if app.count(old)!=1: raise SystemExit(f'render products quantity: {app.count(old)}')
          app=app.replace(old,new,1)

          marker="function syncProductSelection(){"
          if app.count(marker)!=1: raise SystemExit(f'sync marker: {app.count(marker)}')
          queue_code=textwrap.dedent(r'''
            const catalogQuantityQueue=new Map();
            function catalogQuantityForDisplay(name,confirmed=productQuantity(name)){
              const task=catalogQuantityQueue.get(norm(name));
              return task?task.target:confirmed;
            }
            function queueCatalogQuantityChange(name,delta){
              const item=String(name||'').trim(),step=Math.sign(Number(delta)||0);
              if(!item||!step||state.locked)return Promise.resolve();
              const key=norm(item),existing=catalogQuantityQueue.get(key);
              const current=existing?existing.target:productQuantity(item);
              const target=Math.max(0,Math.min(100,current+step));
              if(target===current)return existing?.promise||Promise.resolve();
              const task=existing||{name:item,target:current,processing:false,promise:null};
              task.target=target;
              catalogQuantityQueue.set(key,task);
              setProductQuantity(item,target);
              if(!task.processing)task.promise=flushCatalogQuantityQueue(key,task);
              return task.promise;
            }
            async function flushCatalogQuantityQueue(key,task){
              task.processing=true;
              try{
                while(catalogQuantityQueue.get(key)===task&&!state.locked){
                  const confirmed=productQuantity(task.name),target=task.target;
                  if(confirmed===target)break;
                  if(confirmed<target)await incrementProduct(task.name);
                  else await decrementProduct(task.name);
                  const next=productQuantity(task.name);
                  setProductQuantity(task.name,task.target);
                  if(next===confirmed)break;
                }
              }finally{
                task.processing=false;
                if(catalogQuantityQueue.get(key)===task){
                  catalogQuantityQueue.delete(key);
                  setProductQuantity(task.name,productQuantity(task.name));
                }
              }
            }
          ''').lstrip()
          app=app.replace(marker,queue_code+marker,1)

          old="    setProductQuantity(card.dataset.name||'',quantities.get(norm(card.dataset.name))||0);"
          new="    const name=card.dataset.name||'';\n    setProductQuantity(name,catalogQuantityForDisplay(name,quantities.get(norm(name))||0));"
          if app.count(old)!=1: raise SystemExit(f'sync product quantity: {app.count(old)}')
          app=app.replace(old,new,1)
          app_path.write_text(app,encoding='utf-8')

          qtest_path=Path('tests/list-quantities.test.mjs')
          qtest=qtest_path.read_text(encoding='utf-8')
          anchor="\n\ntest('le menu trois points adopte un glass iOS plus compact et fondu sans changer les actions',()=>{"
          if qtest.count(anchor)!=1: raise SystemExit(f'quantity test anchor: {qtest.count(anchor)}')
          test_code=textwrap.dedent(r'''

            test('le catalogue cumule immédiatement les appuis rapides sur plus et moins',async()=>{
              const queueStart=source.indexOf('const catalogQuantityQueue=new Map();');
              const queueEnd=source.indexOf('function syncProductSelection()',queueStart);
              assert.ok(queueStart>=0&&queueEnd>queueStart,'file de quantité catalogue introuvable');
              let quantity=0,firstAdd=true,release;
              const gate=new Promise(resolve=>{release=resolve});
              const shown=[];
              const context={
                Map,Math,Number,String,Promise,
                state:{locked:false},
                norm:value=>String(value).toLowerCase(),
                productQuantity:()=>quantity,
                setProductQuantity:(_name,value)=>shown.push(value),
                incrementProduct:async()=>{if(firstAdd){firstAdd=false;await gate}quantity+=1},
                decrementProduct:async()=>{quantity-=1}
              };
              vm.runInNewContext(source.slice(queueStart,queueEnd)+';globalThis.catalogQueueApi={queueCatalogQuantityChange,catalogQuantityForDisplay};',context);
              const api=context.catalogQueueApi;
              const adding=api.queueCatalogQuantityChange('Crème liquide',1);
              api.queueCatalogQuantityChange('Crème liquide',1);
              api.queueCatalogQuantityChange('Crème liquide',1);
              assert.equal(shown.at(-1),3);
              assert.equal(api.catalogQuantityForDisplay('Crème liquide',0),3);
              release();
              await adding;
              assert.equal(quantity,3);
              assert.equal(shown.at(-1),3);
              const removing=api.queueCatalogQuantityChange('Crème liquide',-1);
              api.queueCatalogQuantityChange('Crème liquide',-1);
              api.queueCatalogQuantityChange('Crème liquide',-1);
              assert.equal(shown.at(-1),0);
              await removing;
              assert.equal(quantity,0);
              assert.equal(shown.at(-1),0);
            });
          ''')
          qtest=qtest.replace(anchor,test_code+anchor,1)
          qtest_path.write_text(qtest,encoding='utf-8')

          local_path=Path('dish-local-images.js')
          local=local_path.read_text(encoding='utf-8')
          local,n=re.subn(r"const APP_VERSION='v\d+'",f"const APP_VERSION='{version}'",local,count=1)
          if n!=1: raise SystemExit('APP_VERSION')
          local_path.write_text(local,encoding='utf-8')

          catalog_path=Path('catalog.js')
          catalog=catalog_path.read_text(encoding='utf-8')
          catalog,n=re.subn(r"dish-local-images\.js\?v=\d+",f'dish-local-images.js?v={V}',catalog,count=1)
          if n!=1: raise SystemExit('catalog local images cache')
          catalog_path.write_text(catalog,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          for pat,rep,label in [
              (r"catalog\.js\?v=\d+",f'catalog.js?v={V}','catalog'),
              (r"app\.js\?v=\d+",f'app.js?v={V}','app'),
          ]:
              index,n=re.subn(pat,rep,index,count=1)
              if n!=1: raise SystemExit('index '+label)
          index,n=re.subn(r'(<span class="page-version">)v\d+',rf'\1{version}',index)
          if n!=3: raise SystemExit(f'page badges: {n}')
          index_path.write_text(index,encoding='utf-8')

          sw_path=Path('sw.js')
          sw=sw_path.read_text(encoding='utf-8')
          sw,n=re.subn(r"const CACHE='courses-app-v\d+-r1';",f"const CACHE='courses-app-v{V}-r1';",sw,count=1)
          if n!=1: raise SystemExit('sw cache')
          shell=re.search(r"const SHELL=\[(.*?)\];",sw,re.S)
          if not shell: raise SystemExit('sw shell')
          body=shell.group(1)
          for entry in (f"'./catalog.js?v={V}'",f"'./app.js?v={V}'",f"'./dish-local-images.js?v={V}'"):
              if entry not in body: body+=','+entry
          sw=sw[:shell.start(1)]+body+sw[shell.end(1):]
          sw_path.write_text(sw,encoding='utf-8')

          pref_path=Path('tests/preference-popups.test.mjs')
          pref=pref_path.read_text(encoding='utf-8')
          ppat=re.compile(r"test\('la version visible passe à v344 et les ressources de feedback sont rechargées'.*?\n\}\);\s*$",re.S)
          prep=textwrap.dedent(r'''
            test('la version visible passe à v345 et les ressources du catalogue sont rechargées',()=>{
              const index=read('index.html');
              const catalog=read('catalog.js');
              const settings=read('settings-tab-badge.js');
              const sw=read('sw.js');
              const localImages=read('dish-local-images.js');
              assert.match(index,/styles\.css\?v=344/);
              assert.match(index,/catalog\.js\?v=345/);
              assert.match(index,/app\.js\?v=345/);
              assert.match(index,/settings-tab-badge\.js\?v=344/);
              assert.equal((index.match(/page-version\">v345/g)||[]).length,3);
              assert.match(catalog,/dishes-ui\.js\?v=344/);
              assert.match(catalog,/dish-local-images\.js\?v=345/);
              assert.match(settings,/missing-products-dishes\.js\?v=6/);
              assert.match(settings,/missing-products-modern\.js\?v=6/);
              assert.match(sw,/courses-app-v345-r1/);
              assert.match(sw,/styles\.css\?v=344/);
              assert.match(sw,/catalog\.js\?v=345/);
              assert.match(sw,/app\.js\?v=345/);
              assert.match(sw,/settings-tab-badge\.js\?v=344/);
              assert.match(sw,/missing-products-dishes\.js\?v=6/);
              assert.match(sw,/dishes-ui\.js\?v=344/);
              assert.match(sw,/dish-local-images\.js\?v=345/);
              assert.match(localImages,/const APP_VERSION='v345'/);
            });
          ''').lstrip()
          pref,n=ppat.subn(lambda _:prep,pref,count=1)
          if n!=1: raise SystemExit(f'version test: {n}')
          pref_path.write_text(pref,encoding='utf-8')

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          git diff --check

      - name: Validate final change
        shell: bash
        run: |
          set -euo pipefail
          grep -q "queueCatalogQuantityChange(product.name,1)" app.js
          grep -q "queueCatalogQuantityChange(product.name,-1)" app.js
          grep -q "const catalogQuantityQueue=new Map();" app.js
          grep -q "page-version\">v345" index.html
          grep -q "const APP_VERSION='v345'" dish-local-images.js
          grep -q "courses-app-v345-r1" sw.js

      - name: Ensure main did not move
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "1b577c113518435a1cb5a3e619bcce5710d1bf7b"

      - name: Commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add app.js tests/list-quantities.test.mjs dish-local-images.js catalog.js index.html sw.js tests/preference-popups.test.mjs
          git commit -m "v345: accélère les quantités du catalogue"
          git push origin HEAD:main
