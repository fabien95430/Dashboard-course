name: Agent category reorg v373

on:
  push:

permissions:
  contents: write

concurrency:
  group: agent-category-reorg-v373
  cancel-in-progress: false

jobs:
  reorg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/category-reorg-v373
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Appliquer la migration
        run: python3 scripts/agent_category_reorg.py

      - name: Vérifier toute la suite Node
        run: node --test tests/*.test.mjs

      - name: Contrôler et conserver le résultat
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/agent_category_reorg.py
          rm .github/workflows/agent-category-reorg-v373.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "agent-result: réorganisation catégories v373 validée"
          git push origin HEAD:agent/category-reorg-v373
