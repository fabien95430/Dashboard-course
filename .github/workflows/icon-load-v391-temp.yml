name: Validate icon loading v391
on:
  push:
    branches: [tmp-icons-v391]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply owned-module fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          V='391'
          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def once(text,old,new,label):
              count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old,new,1)

          # Ma liste: the owning renderer starts the image request immediately.
          path='app.js'; text=read(path)
          text=once(text,
            "    '<img src=\"'+source+'\" alt=\"\" loading=\"'+(compact?'lazy':'eager')+'\" decoding=\"async\" draggable=\"false\" data-single-product-source=\"'+source+'\">'+",
            "    '<img src=\"'+source+'\" alt=\"\" loading=\"eager\" fetchpriority=\"'+(compact?'high':'auto')+'\" decoding=\"async\" draggable=\"false\" data-single-product-source=\"'+source+'\">'+",
            'app product image loading')
          write(path,text)

          # Dish ingredient thumbs: direct canonical WebP, no hidden Catalogue search/timing dependency.
          path='dishes-ui.js'; text=read(path)
          text=once(text,
            "const dishPhotoUrl=name=>'./www/Plats/'+(CHILD_DISHES.has(name)?'enfant-':'')+(DISH_SPECIAL_SLUGS[name]||dishSlug(name))+'.png';",
            "const dishPhotoUrl=name=>'./www/Plats/'+(CHILD_DISHES.has(name)?'enfant-':'')+(DISH_SPECIAL_SLUGS[name]||dishSlug(name))+'.png';\nconst ingredientImageSource=name=>'./www/Items/'+normalize(name).replace(/\\s+/g,'-')+'.webp';",
            'ingredient image source')
          text=once(text,"const ingredientThumbCache=new Map();\n",'', 'ingredient thumb cache')
          text=once(text,"let ingredientThumbRequest=0;\nlet ingredientThumbUserQuery=null;\n",'', 'ingredient thumb request state')
          text=once(text,"  void primeDishIngredientThumbs(dish);\n",'', 'dish thumb priming call')
          text=re.sub(r"function cancelIngredientThumbs\(\)\{.*?\n\}\nfunction closeDishSheet\(\)\{", "function closeDishSheet(){", text, count=1, flags=re.S)
          if 'function cancelIngredientThumbs()' in text: raise SystemExit('cancelIngredientThumbs still present')
          text=text.replace('  cancelIngredientThumbs();\n','')
          text=re.sub(r"async function primeDishIngredientThumbs\(dish\)\{.*?\n\}\nfunction renderDishSheetIngredients\(\)\{", "function renderDishSheetIngredients(){", text, count=1, flags=re.S)
          if 'primeDishIngredientThumbs' in text: raise SystemExit('primeDishIngredientThumbs still present')
          old="""    const selected=selectedIngredients.has(name);\n    const thumb=ingredientThumbCache.get(name)||'';\n    return '<button type=\"button\" class=\"dish-ingredient '+(selected?'is-selected':'')+'\" data-ingredient=\"'+escapeHtml(name)+'\" aria-pressed=\"'+(selected?'true':'false')+'\">'+\n      '<span class=\"dish-ingredient-thumb\" aria-hidden=\"true\">'+thumb+'</span>'+ """
          new="""    const selected=selectedIngredients.has(name);\n    const source=ingredientImageSource(name);\n    const thumb='<span class=\"sprite premium-sprite is-single-product-image is-compact\"><img src=\"'+source+'\" alt=\"\" loading=\"eager\" fetchpriority=\"high\" decoding=\"async\" draggable=\"false\" data-single-product-source=\"'+source+'\"></span>';\n    return '<button type=\"button\" class=\"dish-ingredient '+(selected?'is-selected':'')+'\" data-ingredient=\"'+escapeHtml(name)+'\" aria-pressed=\"'+(selected?'true':'false')+'\">'+\n      '<span class=\"dish-ingredient-thumb\" aria-hidden=\"true\">'+thumb+'</span>'+ """
          text=once(text,old,new,'direct ingredient thumb')
          text=re.sub(r"\nfunction setHiddenCatalogQuery\(value\)\{.*?\nfunction nextPaint\(\)\{.*?\n\}\n?", "\n", text, count=1, flags=re.S)
          if 'setHiddenCatalogQuery' in text or 'nextPaint()' in text: raise SystemExit('hidden catalogue image path still present')
          write(path,text)

          # Remove the temporary eager-loading patch from the unrelated error module.
          path='error-feedback-bridge.js'; text=read(path)
          marker="\n(() => {\n'use strict';\n\nfunction forceListImagesEager(root){"
          if marker not in text: raise SystemExit('temporary list image patch not found')
          text=text.split(marker,1)[0].rstrip()+"\n"
          write(path,text)

          # Version/cache and loaders.
          path='index.html'; text=read(path)
          text=text.replace('page-version">v390','page-version">v391')
          if text.count('page-version">v391')!=3: raise SystemExit('index page versions not all v391')
          text=once(text,'./catalog.js?v=390','./catalog.js?v=391','index catalog version')
          text=once(text,'./app.js?v=387','./app.js?v=391','index app version')
          text=once(text,'./error-feedback-bridge.js?v=390','./error-feedback-bridge.js?v=391','index error bridge version')
          write(path,text)

          path='catalog.js'; text=read(path)
          text=once(text,'./dishes-ui.js?v=364','./dishes-ui.js?v=391','catalog dishes version')
          text=once(text,'./dish-local-images.js?v=390','./dish-local-images.js?v=391','catalog local images version')
          write(path,text)

          path='dish-local-images.js'; text=read(path)
          text=once(text,"const APP_VERSION='v390';","const APP_VERSION='v391';",'runtime app version')
          write(path,text)

          path='sw.js'; text=read(path)
          text=once(text,"const CACHE='courses-app-v390-r1';","const CACHE='courses-app-v391-r1';",'service worker cache')
          shell_end=text.index('];',text.index('const SHELL=['))
          additions=["'./catalog.js?v=391'","'./app.js?v=391'","'./dishes-ui.js?v=391'","'./dish-local-images.js?v=391'","'./error-feedback-bridge.js?v=391'"]
          prefix=text[:shell_end]
          for item in additions:
              if item not in prefix: prefix+=','+item
          text=prefix+text[shell_end:]
          write(path,text)

          # Executable regression coverage for immediate icons and module ownership.
          path='tests/product-images-no-atlas.test.mjs'; text=read(path)
          test_block=r'''\ntest('Ma liste et la fiche plat demandent directement leurs WebP sans délai artificiel',()=>{\n  const app=read('app.js');\n  const dishes=read('dishes-ui.js');\n  const bridge=read('error-feedback-bridge.js');\n  assert.match(app,/loading=\\\"eager\\\" fetchpriority=\\\"'\\+\\(compact\\?'high':'auto'\\)\\+'\\\"/);\n  assert.match(dishes,/const ingredientImageSource=name=>'.\\/www\\/Items\\/'\\+normalize\\(name\\)\\.replace\\(\\/\\\\s\\+\\/g,'-'\\)\\+'\\.webp'/);\n  assert.match(dishes,/dish-ingredient-thumb[\\s\\S]*?loading=\\\"eager\\\" fetchpriority=\\\"high\\\"/);\n  assert.doesNotMatch(dishes,/ingredientThumbCache|ingredientThumbRequest|ingredientThumbUserQuery|primeDishIngredientThumbs|setHiddenCatalogQuery|nextPaint\\(\\)/);\n  assert.doesNotMatch(bridge,/forceListImagesEager|startListImageWarmup/);\n});\n'''
          if "Ma liste et la fiche plat demandent directement leurs WebP" not in text: text+=test_block
          write(path,text)

          # Bring global-version tests up to the current release instead of the obsolete v383 assertions.
          path='tests/startup-shell.test.mjs'; text=read(path).replace('v383','v391')
          write(path,text)

          path='tests/preference-popups.test.mjs'; text=read(path)
          start=text.index("test('la version visible runtime passe à v383")
          replacement="""test('la version visible runtime passe à v391 et recharge les modules modifiés',()=>{\n  const index=read('index.html'),catalog=read('catalog.js'),sw=read('sw.js'),localImages=read('dish-local-images.js');\n  assert.match(index,/catalog\\.js\\?v=391/); assert.match(index,/app\\.js\\?v=391/); assert.match(index,/error-feedback-bridge\\.js\\?v=391/);\n  assert.equal((index.match(/page-version\\\">v391/g)||[]).length,3);\n  assert.match(catalog,/dishes-ui\\.js\\?v=391/); assert.match(catalog,/dish-local-images\\.js\\?v=391/);\n  assert.match(sw,/courses-app-v391-r1/); assert.match(sw,/app\\.js\\?v=391/); assert.match(sw,/dishes-ui\\.js\\?v=391/);\n  assert.match(localImages,/const APP_VERSION='v391'/);\n});\n"""
          text=text[:start]+replacement
          write(path,text)
          PY
      - name: Verify
        shell: bash
        run: |
          node --check app.js
          node --check dishes-ui.js
          node --check dish-local-images.js
          node --check catalog.js
          node --check error-feedback-bridge.js
          node --check sw.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit validated tree
        shell: bash
        run: |
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git rm .github/workflows/icon-load-v391-temp.yml
          git add app.js dishes-ui.js error-feedback-bridge.js index.html catalog.js dish-local-images.js sw.js tests/product-images-no-atlas.test.mjs tests/startup-shell.test.mjs tests/preference-popups.test.mjs
          git commit -m "v391: accélère les icônes produits"
          git push origin HEAD:tmp-icons-v391
