name: Validate icon loading v391
on:
  push:
    branches:
      - tmp-icons-v391
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: |
          python3 scripts/icon_load_v391_temp.py
          python3 scripts/icon_load_v391_testfix_temp.py
      - name: Verify
        run: |
          node --check app.js
          node --check dishes-ui.js
          node --check dish-local-images.js
          node --check catalog.js
          node --check error-feedback-bridge.js
          node --check sw.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit validated tree
        run: |
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git rm .github/workflows/icon-load-v391-temp.yml scripts/icon_load_v391_temp.py scripts/icon_load_v391_testfix_temp.py
          git add app.js dishes-ui.js error-feedback-bridge.js index.html catalog.js dish-local-images.js sw.js tests/product-images-no-atlas.test.mjs tests/startup-shell.test.mjs tests/error-center-loading.test.mjs tests/catalog-ordering.test.mjs tests/preference-popups.test.mjs
          git commit -m "v391: accélère les icônes produits"
          git push origin HEAD:tmp-icons-v391
