name: P4 chargement différé technique

on:
  push:
    branches: [tech/p4-deferred-startup]

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply P4 deferred loading
        run: node scripts/p4_defer_catalog_features.mjs
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        run: |
          git config user.name "Fabien"
          git config user.email "canape-silence-8o@icloud.com"
          git add -A
          git commit -m "P4: diffère les fonctions Catalogue non critiques"
          git push origin HEAD:tech/p4-deferred-startup
