name: Fix missing popup observer loop v357

on:
  push:
    branches:
      - agent-v356-popup-loop

permissions:
  contents: write

jobs:
  fix-popup-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify expected main
        run: test "$(git rev-parse HEAD)" = "f44d6eadfcaf6a97e5740fac213c87767559e30e"

      - name: Apply v357 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              actual=text.count(old)
              if actual!=count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:90]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          def sub_once(path, pattern, replacement):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              updated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f'{path}: regex did not match exactly once: {pattern}')
              p.write_text(updated,encoding='utf-8')

          sub_once(
              'missing-products-fixes.js',
              r"progress\.textContent=failed\?'Erreur':'En cours';\s*if\(cancelled\)progress\.textContent='Annulé';",
              "const progressLabel=cancelled?'Annulé':failed?'Erreur':'En cours';\n      if(progress.textContent!==progressLabel)progress.textContent=progressLabel;"
          )
          sub_once(
              'missing-products-fixes.js',
              r"progress\.setAttribute\('aria-label',cancelled\?'Intégration annulée':failed\?'Erreur lors de l’intégration':'Intégration en cours'\);",
              "const progressAriaLabel=cancelled?'Intégration annulée':failed?'Erreur lors de l’intégration':'Intégration en cours';\n      if(progress.getAttribute('aria-label')!==progressAriaLabel)progress.setAttribute('aria-label',progressAriaLabel);"
          )

          sub_once(
              'missing-products-popup-ui.js',
              r"thumb\.className='missing-request-thumb is-'\+type;\s*thumb\.innerHTML=thumbSvg\(type\);",
              "const className='missing-request-thumb is-'+type;\n  if(thumb.className!==className)thumb.className=className;\n  if(thumb.dataset.requestThumbType!==type){\n    thumb.dataset.requestThumbType=type;\n    thumb.innerHTML=thumbSvg(type);\n  }"
          )
          sub_once(
              'missing-products-popup-ui.js',
              r"integrate\.disabled=true;\s*integrate\.textContent='Ajouté ✓';",
              "if(!integrate.disabled)integrate.disabled=true;\n    if(integrate.textContent!=='Ajouté ✓')integrate.textContent='Ajouté ✓';"
          )
          sub_once(
              'missing-products-popup-ui.js',
              r"const running=integrate\.classList\.contains\('is-running'\)\|\|integrate\.disabled;\s*integrate\.textContent=running\?'En cours…':'Intégrer';",
              "const running=integrate.classList.contains('is-running')||integrate.disabled;\n  const label=running?'En cours…':'Intégrer';\n  if(integrate.textContent!==label)integrate.textContent=label;"
          )
          sub_once(
              'missing-products-popup-ui.js',
              r"row\.classList\.remove\('is-request-product','is-request-dish','is-request-dessert'\);\s*row\.classList\.add\('missing-request-row','is-request-'\+type\);",
              "if(!row.classList.contains('missing-request-row'))row.classList.add('missing-request-row');\n  ['product','dish','dessert'].forEach(kind=>{\n    const className='is-request-'+kind;\n    const active=kind===type;\n    if(row.classList.contains(className)!==active)row.classList.toggle(className,active);\n  });"
          )

          replace_exact('index.html','page-version">v356','page-version">v357',3)
          replace_exact('index.html','./catalog.js?v=356','./catalog.js?v=357')
          replace_exact('catalog.js',"images.src='./dish-local-images.js?v=355';","images.src='./dish-local-images.js?v=357';")
          replace_exact('dish-local-images.js',"const APP_VERSION='v355';","const APP_VERSION='v357';")
          replace_exact('dish-local-images.js',"script.src='./missing-products-fixes.js?v=18';","script.src='./missing-products-fixes.js?v=19';")
          replace_exact('dish-local-images.js',"script.src='./missing-products-popup-ui.js?v=17';","script.src='./missing-products-popup-ui.js?v=18';")
          replace_exact('sw.js',"const CACHE='courses-app-v355-r1';","const CACHE='courses-app-v357-r1';")
          replace_exact(
              'sw.js',
              "'./catalog.js?v=355','./missing-products-popup-ui.js?v=17','./dish-local-images.js?v=355'];",
              "'./catalog.js?v=355','./missing-products-popup-ui.js?v=17','./dish-local-images.js?v=355','./catalog.js?v=356','./app.js?v=356','./settings-tab-badge.js?v=356','./catalog.js?v=357','./missing-products-fixes.js?v=19','./missing-products-popup-ui.js?v=18','./dish-local-images.js?v=357'];"
          )

          tests=Path('tests/preference-popups.test.mjs')
          source=tests.read_text(encoding='utf-8')
          old_status="assert.ok(fixes.includes(\"progress.textContent=failed?'Erreur':'En cours';\"));"
          new_status="assert.ok(fixes.includes(\"const progressLabel=cancelled?'Annulé':failed?'Erreur':'En cours';\"));"
          if source.count(old_status)!=1:
              raise SystemExit('old status assertion not found exactly once')
          source=source.replace(old_status,new_status,1)
          marker="test('la version visible passe à v356 et les scripts principaux sont rechargés',()=>{"
          start=source.find(marker)
          if start<0:
              raise SystemExit('v356 version test marker not found')
          source=source[:start]+r"""test('les décorations du popup sont idempotentes et ne nourrissent plus leurs MutationObserver',()=>{
            const fixes=read('missing-products-fixes.js');
            const popup=read('missing-products-popup-ui.js');
            assert.match(fixes,/const progressLabel=cancelled\?'Annulé':failed\?'Erreur':'En cours';/);
            assert.match(fixes,/if\(progress\.textContent!==progressLabel\)progress\.textContent=progressLabel;/);
            assert.match(popup,/if\(thumb\.dataset\.requestThumbType!==type\)\{[\s\S]*?thumb\.innerHTML=thumbSvg\(type\)/);
            assert.match(popup,/if\(integrate\.textContent!=='Ajouté ✓'\)integrate\.textContent='Ajouté ✓';/);
            assert.match(popup,/if\(integrate\.textContent!==label\)integrate\.textContent=label;/);
            assert.doesNotMatch(popup,/row\.classList\.remove\('is-request-product','is-request-dish','is-request-dessert'\)/);
          });

          test('la version visible passe à v357 et recharge les modules corrigés du popup',()=>{
            const index=read('index.html'),catalog=read('catalog.js'),settings=read('settings-tab-badge.js'),sw=read('sw.js'),localImages=read('dish-local-images.js');
            assert.match(index,/styles\.css\?v=348/);
            assert.match(index,/catalog\.js\?v=357/);
            assert.match(index,/app\.js\?v=356/);
            assert.match(index,/settings-tab-badge\.js\?v=356/);
            assert.equal((index.match(/page-version\">v357/g)||[]).length,3);
            assert.match(catalog,/dishes-ui\.js\?v=344/);
            assert.match(catalog,/dish-local-images\.js\?v=357/);
            assert.match(settings,/missing-products-dishes\.js\?v=8/);
            assert.match(sw,/courses-app-v357-r1/);
            assert.match(sw,/catalog\.js\?v=357/);
            assert.match(sw,/app\.js\?v=356/);
            assert.match(sw,/settings-tab-badge\.js\?v=356/);
            assert.match(sw,/missing-products-fixes\.js\?v=19/);
            assert.match(sw,/missing-products-popup-ui\.js\?v=18/);
            assert.match(sw,/dish-local-images\.js\?v=357/);
            assert.match(localImages,/const APP_VERSION='v357'/);
            assert.match(localImages,/missing-products-fixes\.js\?v=19/);
            assert.match(localImages,/missing-products-popup-ui\.js\?v=18/);
          });
          """
          tests.write_text(source,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --test tests/*.test.mjs
          git diff --check
          git diff --exit-code -- AGENTS.md
          test "$(grep -o 'page-version\">v357' index.html | wc -l)" -eq 3
          ! grep -q "progress.textContent=failed?'Erreur':'En cours'" missing-products-fixes.js
          ! grep -q "row.classList.remove('is-request-product','is-request-dish','is-request-dessert')" missing-products-popup-ui.js

      - name: Ensure main did not move
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "f44d6eadfcaf6a97e5740fac213c87767559e30e"

      - name: Commit and push main
        run: |
          git config user.name "Fabien"
          git config user.email "canape-silence-8o@icloud.com"
          git add missing-products-fixes.js missing-products-popup-ui.js index.html catalog.js dish-local-images.js sw.js tests/preference-popups.test.mjs
          git commit -m "v357: supprime la boucle du popup des demandes"
          git push origin HEAD:main
