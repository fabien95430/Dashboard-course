# Garde le projet Supabase « courses-famille » éveillé (offre gratuite :
# pause après 7 jours sans activité). Appelle la fonction ping() deux fois
# par semaine. La clé publishable est publique : pas besoin de secret.
# Fonction ping() : supabase/01-famille.sql.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi, 06:17 UTC
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://tbzcvyxvoxburuuoodvh.supabase.co
      SUPABASE_KEY: sb_publishable_OCoP4SmvfqxVPKdJbhdHsA_BFraB-fh
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase réveillé."
