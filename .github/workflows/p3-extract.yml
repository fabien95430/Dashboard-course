name: P3 extraction technique

on:
  push:
    branches:
      - tech/p3-app-responsibilities

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P3 extraction
        run: node scripts/p3_extract_bottom_nav.mjs
      - name: Run full tests
        run: node --test tests/*.test.mjs
      - name: Run repository validator
        run: bash scripts/validate_repo.sh
      - name: Commit validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P3 validated extraction"
          git push origin HEAD:tech/p3-app-responsibilities
