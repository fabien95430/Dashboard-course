name: Prepare validated juice visuals
on:
  push:
    branches: [automation/beer-visuals-20261105]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 .juice-transfer/prepare.py
      - run: python3 scripts/update_visual_hashes.py
      - run: bash scripts/validate_repo.sh > .juice-transfer/validation.log 2>&1
      - name: Preserve verification
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/Items sw.js .juice-transfer
          git diff --cached --quiet || git commit -m "Prepare seven validated juice WebPs and verification"
          git push origin HEAD:automation/beer-visuals-20261105
