name: Mettre en file une intégration du catalogue

on:
  repository_dispatch:
    types: [courses_dish_request]

permissions:
  contents: write

concurrency:
  group: courses-catalog-watch-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DISH_NAME: ${{ github.event.client_payload.name }}
      DISH_CATEGORY: ${{ github.event.client_payload.category }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      PUSH_ENDPOINT: ${{ github.event.client_payload.push_endpoint }}
      PUSH_P256DH: ${{ github.event.client_payload.push_p256dh }}
      PUSH_AUTH: ${{ github.event.client_payload.push_auth }}
      PUSH_PUBLIC_KEY: ${{ github.event.client_payload.push_public_key }}
      COURSES_BASE_URL: https://fabien95430.github.io/Dashboard-course/
      COURSES_VAPID_PRIVATE_KEY: ${{ secrets.COURSES_VAPID_PRIVATE_KEY }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enregistrer la demande dans la file Git
        id: queue
        shell: python
        run: |
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          raw_name=os.environ.get('DISH_NAME','').strip()
          raw_category=os.environ.get('DISH_CATEGORY','').strip()
          request_id=os.environ.get('REQUEST_ID','').strip()
          product_prefix='__courses_product__:'
          item_type='product' if raw_name.startswith(product_prefix) else 'dish'
          item_name=raw_name[len(product_prefix):].strip() if item_type=='product' else raw_name
          if not item_name:
              raise SystemExit('Nom de l’élément manquant.')
          safe_request_id=re.sub(r'[^a-zA-Z0-9._-]+','-',request_id).strip('-')[:80]
          if not safe_request_id:
              raise SystemExit('Identifiant de demande manquant.')

          path=Path('requests/pending')/(safe_request_id+'.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          payload={
              'request_id':request_id,
              'type':item_type,
              'name':item_name,
              'category':raw_category,
              'created_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'source':'courses'
          }
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          output=Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a',encoding='utf-8') as stream:
              stream.write(f'request_path={path.as_posix()}\n')
              stream.write(f'item_type={item_type}\n')
              stream.write(f'item_name={item_name}\n')
          print(f'Demande mise en file: {item_type} — {item_name} — {path}')

      - name: Commit atomique de la demande
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.queue.outputs.request_path }}"
          if git diff --cached --quiet; then
            echo "La demande existe déjà dans la file."
            exit 0
          fi
          git commit -m "queue: demande d’intégration ${{ steps.queue.outputs.item_name }}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Impossible d'enregistrer la demande sur main." >&2
          exit 1

      - name: Attendre l’intégration faite par ChatGPT
        id: wait
        continue-on-error: true
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import time
          import unicodedata
          from pathlib import Path

          raw_name=os.environ.get('DISH_NAME','').strip()
          product_prefix='__courses_product__:'
          item_type='product' if raw_name.startswith(product_prefix) else 'dish'
          item_name=raw_name[len(product_prefix):].strip() if item_type=='product' else raw_name
          if not item_name:
              raise SystemExit('Nom de l’élément manquant.')

          def normalize(value):
              value=str(value or '').replace('œ','oe').lower()
              value=''.join(ch for ch in unicodedata.normalize('NFD',value) if unicodedata.category(ch)!='Mn')
              return re.sub(r'[^a-z0-9]+',' ',value).strip()

          def slugify(value):
              return normalize(value).replace(' ','-').strip('-')

          special={
              'Tagliatelles au saumon':'tagliatelles-saumon',
              'Gratin de courgettes':'gratin-courgettes',
              'Poulet pommes de terre au four':'poulet-pommes-de-terre-four',
          }

          def app_version():
              version_text=Path('dish-local-images.js').read_text(encoding='utf-8')
              match=re.search(r"const APP_VERSION='v(\d+)'",version_text)
              return match.group(1) if match else None

          def product_exists():
              text=Path('catalog.js').read_text(encoding='utf-8')
              if 'groups:' not in text or '\n    meta:' not in text:
                  return False
              groups=text.split('groups:',1)[1].split('\n    meta:',1)[0]
              return json.dumps(item_name,ensure_ascii=False) in groups

          def read_dish_names():
              text=Path('dishes-ui.js').read_text(encoding='utf-8')
              matches=re.findall(r"name:'((?:\\.|[^'])*)'",text)
              return {normalize(value.replace("\\'","'").replace('\\\\','\\')) for value in matches}

          def find_ready_item():
              subprocess.run(['git','fetch','--quiet','origin','main'],check=True)
              subprocess.run(['git','reset','--hard','--quiet','origin/main'],check=True)
              version=app_version()
              if not version:
                  return None

              if item_type=='product':
                  if not product_exists():
                      return None
                  return version,''

              if normalize(item_name) not in read_dish_names():
                  return None
              slug=special.get(item_name,slugify(item_name))
              candidates=[
                  Path('www/Plats')/(slug+'.png'),
                  Path('www/Plats')/('enfant-'+slug+'.png'),
              ]
              image=next((path for path in candidates if path.is_file()),None)
              if not image:
                  return None
              return version,image.name

          deadline=time.time()+95*60
          found=None
          while time.time()<deadline:
              try:
                  found=find_ready_item()
              except Exception as error:
                  print(f'Veille temporairement indisponible: {error}')
              if found:
                  break
              time.sleep(30)

          if not found:
              raise SystemExit("L’élément demandé n’a pas été détecté sur main dans les 95 minutes.")

          version,filename=found
          output=Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a',encoding='utf-8') as stream:
              stream.write(f'version={version}\n')
              stream.write(f'filename={filename}\n')
              stream.write(f'item_type={item_type}\n')
              stream.write(f'item_name={item_name}\n')
          print(f'Élément détecté sur main: {item_type} — {item_name} — v{version}')

      - name: Confirmer le déploiement GitHub Pages
        id: deploy
        if: steps.wait.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.wait.outputs.version }}"
          type="${{ steps.wait.outputs.item_type }}"
          item="${{ steps.wait.outputs.item_name }}"
          file="${{ steps.wait.outputs.filename }}"
          for attempt in $(seq 1 48); do
            version_body="$(curl -fsSL --max-time 12 "${COURSES_BASE_URL}dish-local-images.js?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
            deployed="$(printf '%s' "$version_body" | sed -n "s/.*const APP_VERSION='v\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            if [ -n "$deployed" ] && [ "$deployed" -ge "$expected" ]; then
              if [ "$type" = "product" ]; then
                catalog_body="$(curl -fsSL --max-time 12 "${COURSES_BASE_URL}catalog.js?courses_deploy=${GITHUB_RUN_ID}-${attempt}" || true)"
                if printf '%s' "$catalog_body" | grep -Fq -- "$item"; then
                  echo "Déploiement du produit confirmé en v${deployed}."
                  exit 0
                fi
              elif curl -fsSIL --max-time 12 "${COURSES_BASE_URL}www/Plats/${file}?courses_deploy=${GITHUB_RUN_ID}-${attempt}" >/dev/null; then
                echo "Déploiement du plat confirmé en v${deployed}."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Le déploiement GitHub Pages de l’élément n'a pas été confirmé." >&2
          exit 1

      - name: Préparer Node pour le Web Push
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer l’émetteur Web Push
        if: always()
        run: npm install --no-save --no-package-lock web-push@3.6.7

      - name: Notification Courses — succès
        if: steps.wait.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          PUSH_STATUS: added
        run: node scripts/send_web_push.mjs

      - name: Notification Courses — erreur
        if: always() && (steps.wait.outcome != 'success' || steps.deploy.outcome != 'success')
        env:
          PUSH_STATUS: error
        run: node scripts/send_web_push.mjs

      - name: Signaler un échec de veille
        if: always() && (steps.wait.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1
