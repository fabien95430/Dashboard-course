name: Agent validate OpenAI cancellation v353

on:
  push:
    branches: [agent-openai-cancel-status-v353]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branche technique
        uses: actions/checkout@v4
        with:
          ref: agent-openai-cancel-status-v353
          fetch-depth: 10

      - name: Patch, test and publish v353
        shell: bash
        env:
          EXPECTED_MAIN: 4a199bfd5d921ad5c43669542f8c8a6d892a4fe0
        run: |
          set -euo pipefail
          encoded="$(git show 227ec64017bfd821b648e9ac65b01f900396d24d:.github/workflows/agent-openai-cancel-v353.yml | sed -n 's/^          PATCH_B64: //p')"
          test -n "$encoded"
          printf '%s' "$encoded" | base64 -d | gzip -d > /tmp/agent-v353.sh
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/agent-v353.sh')
          text=path.read_text()
          old="text=replace_once(text,'assert.equal((index.match(/page-version\">v352/g)||[]).length,3);','assert.equal((index.match(/page-version\">v353/g)||[]).length,3);','badge version test')"
          new="text=replace_once(text,r'assert.equal((index.match(/page-version\\\">v352/g)||[]).length,3);',r'assert.equal((index.match(/page-version\\\">v353/g)||[]).length,3);','badge version test')"
          if old not in text:
              raise SystemExit('badge patch source missing')
          path.write_text(text.replace(old,new,1))
          PY
          bash /tmp/agent-v353.sh
