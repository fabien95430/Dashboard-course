name: Agent validate OpenAI cancellation v353

on:
  push:
    branches: [agent-openai-cancel-status-v353]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branche technique
        uses: actions/checkout@v4
        with:
          ref: agent-openai-cancel-status-v353
          fetch-depth: 10

      - name: Valider et conserver les fichiers applicatifs v353
        shell: bash
        env:
          EXPECTED_MAIN: 4a199bfd5d921ad5c43669542f8c8a6d892a4fe0
        run: |
          set -euo pipefail
          encoded="$(git show 227ec64017bfd821b648e9ac65b01f900396d24d:.github/workflows/agent-openai-cancel-v353.yml | sed -n 's/^          PATCH_B64: //p')"
          test -n "$encoded"
          printf '%s' "$encoded" | base64 -d | gzip -d > /tmp/agent-v353.sh
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/agent-v353.sh')
          text=path.read_text()
          old="text=replace_once(text,'assert.equal((index.match(/page-version\">v352/g)||[]).length,3);','assert.equal((index.match(/page-version\">v353/g)||[]).length,3);','badge version test')"
          new="text=replace_once(text,r'assert.equal((index.match(/page-version\\\">v352/g)||[]).length,3);',r'assert.equal((index.match(/page-version\\\">v353/g)||[]).length,3);','badge version test')"
          if old not in text:
              raise SystemExit('badge patch source missing')
          text=text.replace(old,new,1)
          old_tail='''git config user.name "OpenAI Agent"\ngit config user.email "openai-agent@users.noreply.github.com"\ngit add .github/workflows/integrate-dish-openai.yml catalog.js dish-local-images.js index.html missing-products-fixes.js sw.js tests/openai-cancellation.test.mjs tests/preference-popups.test.mjs\ngit commit -m "v353: gère l’annulation des intégrations OpenAI"\ngit push origin HEAD:main'''
          new_tail='''git checkout -- .github/workflows/integrate-dish-openai.yml\ngit config user.name "OpenAI Agent"\ngit config user.email "openai-agent@users.noreply.github.com"\ngit add catalog.js dish-local-images.js index.html missing-products-fixes.js sw.js tests/openai-cancellation.test.mjs tests/preference-popups.test.mjs\ngit commit -m "v353: fichiers applicatifs validés"\ngit push --force origin HEAD:agent-openai-cancel-validated-v353'''
          if old_tail not in text:
              raise SystemExit('publish tail missing')
          path.write_text(text.replace(old_tail,new_tail,1))
          PY
          bash /tmp/agent-v353.sh
