name: Agent validate OpenAI cancellation v353

on:
  push:
    branches: [agent-openai-cancel-status-v353]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch, test and publish v353
        shell: bash
        env:
          EXPECTED_MAIN: 4a199bfd5d921ad5c43669542f8c8a6d892a4fe0
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/agent-v353.sh
          bash /tmp/agent-v353.sh
