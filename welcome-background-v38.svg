<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset=".58" stop-color="#f4f1e9"/>
      <stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c59c"/>
      <stop offset=".45" stop-color="#dfb17f"/>
      <stop offset="1" stop-color="#c98f5d"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ad78"/>
      <stop offset=".45" stop-color="#c8955e"/>
      <stop offset="1" stop-color="#b97f4c"/>
    </linearGradient>
    <linearGradient id="kraftLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1d2a9" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#fff1d6" stop-opacity=".1"/>
      <stop offset="1" stop-color="#7b4c2b" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="bagFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b77a46"/>
      <stop offset="1" stop-color="#e0b17b"/>
    </linearGradient>
    <radialGradient id="tomato" cx=".35" cy=".25" r=".8">
      <stop offset="0" stop-color="#ff5d3f"/>
      <stop offset=".45" stop-color="#e83b27"/>
      <stop offset="1" stop-color="#b81f16"/>
    </radialGradient>
    <radialGradient id="orange" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffcf4e"/>
      <stop offset=".45" stop-color="#f4a61f"/>
      <stop offset="1" stop-color="#d97d08"/>
    </radialGradient>
    <radialGradient id="lemon" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffe866"/>
      <stop offset=".55" stop-color="#f0c329"/>
      <stop offset="1" stop-color="#d39b0e"/>
    </radialGradient>
    <linearGradient id="baguette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98230"/>
      <stop offset=".45" stop-color="#e5aa55"/>
      <stop offset=".7" stop-color="#f0bf71"/>
      <stop offset="1" stop-color="#b96c22"/>
    </linearGradient>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6b4a2a" flood-opacity=".16"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3725" flood-opacity=".12"/>
    </filter>
    <pattern id="grain" width="90" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 14 C24 6 48 22 90 12" fill="none" stroke="#9f693f" stroke-opacity=".16" stroke-width="2"/>
      <path d="M12 25 C34 16 62 30 86 21" fill="none" stroke="#f8ddb9" stroke-opacity=".18" stroke-width="1.5"/>
    </pattern>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#6e462b" opacity=".045"/>
      <circle cx="14" cy="12" r=".8" fill="#fff" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="720" height="1560" fill="url(#wall)"/>
  <ellipse cx="365" cy="520" rx="390" ry="520" fill="#fff" opacity=".22"/>
  <ellipse cx="370" cy="510" rx="290" ry="430" fill="#fff" opacity=".25"/>

  <!-- blurred indoor plant, intentionally cropped left -->
  <g filter="url(#blur20)" opacity=".92">
    <path d="M37 130 C55 350 50 700 54 1115" fill="none" stroke="#8d9b6d" stroke-width="18" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="-5" cy="165" rx="98" ry="66" transform="rotate(25 -5 165)" fill="#6e913d"/>
    <ellipse cx="52" cy="235" rx="86" ry="54" transform="rotate(-28 52 235)" fill="#7da04b"/>
    <ellipse cx="-18" cy="338" rx="112" ry="67" transform="rotate(18 -18 338)" fill="#54762f"/>
    <ellipse cx="58" cy="430" rx="95" ry="58" transform="rotate(-24 58 430)" fill="#769544"/>
    <ellipse cx="-8" cy="555" rx="110" ry="72" transform="rotate(34 -8 555)" fill="#688a3d"/>
    <ellipse cx="49" cy="684" rx="88" ry="55" transform="rotate(-32 49 684)" fill="#8ea85f"/>
    <ellipse cx="-15" cy="820" rx="112" ry="70" transform="rotate(22 -15 820)" fill="#597c35"/>
    <ellipse cx="60" cy="950" rx="96" ry="56" transform="rotate(-28 60 950)" fill="#75984b"/>
    <ellipse cx="-12" cy="1068" rx="118" ry="74" transform="rotate(16 -12 1068)" fill="#688b3e"/>
  </g>

  <!-- soft bokeh/light spots -->
  <g opacity=".18" filter="url(#blur10)">
    <circle cx="155" cy="235" r="42" fill="#d9dfc0"/>
    <circle cx="105" cy="690" r="58" fill="#e5e2cf"/>
    <circle cx="595" cy="250" r="52" fill="#fff"/>
    <circle cx="625" cy="980" r="65" fill="#efdfc9"/>
  </g>

  <!-- grocery bag on right -->
  <g filter="url(#shadow)">
    <path d="M551 720 L704 660 L720 1450 L548 1455 Z" fill="url(#kraft)"/>
    <path d="M551 720 L594 745 L704 660 L648 640 Z" fill="#e4bb86"/>
    <path d="M594 745 L720 698 L720 1450 L602 1456 Z" fill="#c88f58"/>
    <path d="M548 720 L594 745 L602 1456 L548 1455 Z" fill="url(#bagFold)"/>
    <path d="M552 734 C585 810 565 920 592 1010 C611 1072 593 1170 607 1452" fill="none" stroke="#845832" stroke-opacity=".2" stroke-width="6"/>
    <rect x="548" y="690" width="172" height="770" fill="url(#paper)" opacity=".55"/>
    <path d="M558 724 C603 690 663 675 708 672" fill="none" stroke="url(#kraftLight)" stroke-width="14" opacity=".55"/>
  </g>

  <!-- baguette -->
  <g transform="rotate(9 665 620)" filter="url(#softShadow)">
    <rect x="637" y="420" width="62" height="430" rx="31" fill="url(#baguette)"/>
    <path d="M650 478 Q670 463 688 484" fill="none" stroke="#f6d497" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M647 555 Q668 538 690 560" fill="none" stroke="#f6d497" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M646 635 Q668 618 690 639" fill="none" stroke="#f6d497" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M648 716 Q669 699 689 720" fill="none" stroke="#f6d497" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- leafy greens -->
  <g filter="url(#softShadow)">
    <ellipse cx="595" cy="655" rx="44" ry="95" transform="rotate(-28 595 655)" fill="#4f8b39"/>
    <ellipse cx="632" cy="662" rx="42" ry="102" transform="rotate(8 632 662)" fill="#6ca343"/>
    <ellipse cx="667" cy="690" rx="42" ry="90" transform="rotate(25 667 690)" fill="#4c8a34"/>
    <ellipse cx="567" cy="704" rx="36" ry="82" transform="rotate(-42 567 704)" fill="#6e9f45"/>
    <path d="M574 726 Q600 676 625 630 M610 744 Q632 690 649 638 M649 754 Q670 704 678 660" fill="none" stroke="#315f2a" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- produce peeking from bag -->
  <circle cx="590" cy="735" r="40" fill="url(#orange)"/>
  <circle cx="654" cy="752" r="39" fill="#ec5b22"/>
  <path d="M650 709 C660 686 674 684 680 688" fill="none" stroke="#39702f" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="555" cy="770" rx="29" ry="52" fill="#ef8a1e" transform="rotate(-18 555 770)"/>

  <!-- counter/table -->
  <rect x="0" y="1165" width="720" height="395" fill="url(#table)"/>
  <rect x="0" y="1165" width="720" height="395" fill="url(#grain)"/>
  <path d="M0 1175 C155 1163 324 1193 720 1170" fill="none" stroke="#fff3df" stroke-opacity=".35" stroke-width="4"/>
  <path d="M0 1398 C216 1378 443 1412 720 1393" fill="none" stroke="#a87348" stroke-opacity=".16" stroke-width="3"/>

  <!-- tomatoes left foreground -->
  <g filter="url(#softShadow)">
    <circle cx="38" cy="1290" r="69" fill="url(#tomato)"/>
    <circle cx="112" cy="1324" r="46" fill="url(#tomato)"/>
    <path d="M36 1218 l-14 28 -28 -5 22 19 -13 26 30 -12 25 18 -6 -31 22 -18 -31 1z" fill="#2f6d31"/>
    <path d="M103 1276 l-9 21 -21 -3 16 14 -9 20 22 -8 18 13 -5 -23 17 -14 -23 2z" fill="#3d7a37"/>
  </g>

  <!-- lemon/right foreground -->
  <g filter="url(#softShadow)">
    <path d="M665 1382 C709 1362 745 1400 742 1442 C739 1492 676 1529 624 1508 C592 1495 593 1453 616 1422 C628 1405 645 1391 665 1382Z" fill="url(#lemon)"/>
    <path d="M650 1397 C671 1403 689 1401 706 1394" fill="none" stroke="#fff2a4" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- subtle atmospheric veil keeps central UI zone readable -->
  <rect x="95" y="0" width="525" height="1220" fill="#f7f5ef" opacity=".10"/>
  <ellipse cx="360" cy="770" rx="235" ry="455" fill="#f7f5ef" opacity=".12"/>
</svg>